plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_file_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven {
        name = "Iron's Maven - Release"
        url = 'https://code.redspace.io/releases'
    }
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('runs').dir(name)
        modSource project.sourceSets.main
    }

    client {}
    server {}

    data {
        arguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    epicfightReceiptContract
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "io.redspace:irons_spellbooks:${irons_spells_version}:api"
    compileOnly("maven.modrinth:TKB6INcv:${ars_nouveau_version_id}") {
        transitive = false
    }
    compileOnly("maven.modrinth:vu3NZ5Ma:${epicfight_version_id}") {
        transitive = false
    }
    testCompileOnly("maven.modrinth:vu3NZ5Ma:${epicfight_version_id}") {
        transitive = false
    }
    localRuntime("maven.modrinth:vu3NZ5Ma:${epicfight_version_id}") {
        transitive = false
    }
    compileOnly("curse.maven:goety-586095:${goety_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:malum-484064:${malum_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:eidolon-repraised-870250:${eidolon_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:identity2-1238155:${identity2_file_id}") {
        transitive = false
    }

    epicfightReceiptContract("maven.modrinth:vu3NZ5Ma:${epicfight_version_id}") {
        transitive = false
    }
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
}

def p0002ProviderContractOutput = layout.buildDirectory.dir('p0002-provider-contract-classes')
def p0002JarContractOutput = layout.buildDirectory.dir('p0002-heavy-impact-jar-contract-classes')

tasks.register('compileP0002ProviderContract', JavaCompile) {
    group = 'verification'
    description = 'Compiles only the isolated P-0002 Epic Fight provider contract test.'
    dependsOn tasks.named('classes')
    source = files('src/test/java/dev/gustavopere/rpgskilltree/runtime/compat/epicfight/EpicFightHeavyImpactProviderContractTest.java')
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath + configurations.testCompileClasspath
    destinationDirectory = p0002ProviderContractOutput
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.register('verifyP0002EpicFightProviderContract', JavaExec) {
    group = 'verification'
    description = 'Runs only the P-0002 Epic Fight provider contract without compiling the concurrent core test suite.'
    dependsOn tasks.named('compileP0002ProviderContract')
    classpath = files(p0002ProviderContractOutput) + sourceSets.main.output + sourceSets.main.compileClasspath + configurations.testRuntimeClasspath
    mainClass = 'dev.gustavopere.rpgskilltree.runtime.compat.epicfight.EpicFightHeavyImpactProviderContractTest'
}

tasks.register('compileP0002EpicFightJarContract', JavaCompile) {
    group = 'verification'
    description = 'Compiles the isolated P-0002 exact Epic Fight binary contract.'
    source = files('src/test/java/dev/gustavopere/rpgskilltree/runtime/compat/epicfight/EpicFightHeavyImpactJarContractTest.java')
    classpath = configurations.testCompileClasspath
    destinationDirectory = p0002JarContractOutput
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.register('verifyP0002EpicFightHeavyImpactJarContract', JavaExec) {
    group = 'verification'
    description = 'Proves the P-0002 heavy-impact provider path against the exact distributed Epic Fight JAR.'
    dependsOn tasks.named('compileP0002EpicFightJarContract')
    classpath = files(p0002JarContractOutput) + configurations.testRuntimeClasspath
    mainClass = 'dev.gustavopere.rpgskilltree.runtime.compat.epicfight.EpicFightHeavyImpactJarContractTest'
    doFirst {
        File epicFightJar = configurations.epicfightReceiptContract.singleFile
        if (epicfight_receipt_sha256.toString().isBlank()) {
            throw new GradleException('epicfight_receipt_sha256 must be pinned for the exact P-0002 provider contract')
        }
        args = [epicFightJar.absolutePath, epicfight_receipt_sha256]
        logger.lifecycle("P-0002 Epic Fight contract coordinate: maven.modrinth:vu3NZ5Ma:${epicfight_version_id}")
        logger.lifecycle("P-0002 Epic Fight contract file: ${epicFightJar.name}")
    }
}

tasks.register('verifyEpicFightReceiptJarContract', JavaExec) {
    group = 'verification'
    description = 'Proves the causal stamina receipt bridge against the exact distributed Epic Fight JAR.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gustavopere.rpgskilltree.runtime.compat.epicfight.EpicFightReceiptJarContractTest'
    doFirst {
        File epicFightJar = configurations.epicfightReceiptContract.singleFile
        if (epicfight_receipt_sha256.toString().isBlank()) {
            throw new GradleException('epicfight_receipt_sha256 must be pinned for the exact receipt contract')
        }
        args = [
            epicFightJar.absolutePath,
            epicfight_mod_version,
            epicfight_version_id,
            epicfight_receipt_sha256
        ]
        logger.lifecycle("Epic Fight receipt release: ${epicfight_version}")
        logger.lifecycle("Epic Fight receipt packaged mod version: ${epicfight_mod_version}")
        logger.lifecycle("Epic Fight receipt contract coordinate: maven.modrinth:vu3NZ5Ma:${epicfight_version_id}")
        logger.lifecycle("Epic Fight receipt contract file: ${epicFightJar.name}")
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyEpicFightReceiptJarContract')
    dependsOn tasks.named('verifyP0002EpicFightProviderContract')
    dependsOn tasks.named('verifyP0002EpicFightHeavyImpactJarContract')
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
