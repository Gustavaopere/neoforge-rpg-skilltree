plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'jacoco'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
    id "org.sonarqube" version "7.3.1.8318"
}

sonar {
    properties {
        property "sonar.projectKey", "Gustavaopere_neoforge-rpg-skilltree"
        property "sonar.organization", "gustavaopere"
        property "sonar.coverage.jacoco.xmlReportPaths", layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
        // These are executable acceptance/audit harnesses, not product runtime. They are
        // exercised by dedicated GitHub Actions/NeoForge GameTest gates rather than the
        // JUnit task that produces this JaCoCo report, so keep them out of JaCoCo coverage only.
        property "sonar.coverage.exclusions", [
                "src/main/java/dev/gustavopere/volcanoes/compat/rns/RnsIntegrationGameTests.java",
                "scripts/verify-volcanoes-functional-parity.py",
                "scripts/verify-volcanoes-plan-archive.py",
                "scripts/verify-volcanoes-standalone-parity.py",
                "scripts/volcanoes/verify_release_workflow_set.py"
        ].join(',')
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_file_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
    }
    maven {
        name = "Iron's Maven - Release"
        url = 'https://code.redspace.io/releases'
    }
    maven {
        name = "Iron's Maven - Snapshot"
        url = 'https://code.redspace.io/snapshots'
    }
    maven {
        name = 'LDTTeam Modding'
        url = 'https://ldtteam.jfrog.io/ldtteam/modding/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

jacoco {
    toolVersion = '0.8.14'
}

def epicFightAdapterCoveragePath = 'dev/gustavopere/rpgskilltree/runtime/compat/epicfight/A0031A0040EpicFight*CoverageJUnitTest.java'

sourceSets {
    test {
        // Plain Gradle JUnit must remain independent from NeoGradle's loaded-game test run.
        java.exclude epicFightAdapterCoveragePath
    }
    neoForgeTest {
        // Reuse the existing source location but isolate the adapter tests that require a loaded NeoForge server.
        java.srcDir 'src/test/java'
        java.include epicFightAdapterCoveragePath
        resources.srcDir 'src/test/resources'
        resources.include 'META-INF/MANIFEST.MF'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('runs').dir(name)
        modSource project.sourceSets.main
    }

    client {}
    server {}

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id},volcanoes"
    }

    // Keep the NeoForge-loaded adapter suite on a dedicated source set so NeoGradle cannot
    // consume or rewrite the ordinary Gradle test source set/task.
    junit {
        modSource project.sourceSets.main
        unitTestSource project.sourceSets.neoForgeTest
    }

    data {
        arguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    neoForgeTestImplementation.extendsFrom testImplementation
    neoForgeTestCompileOnly.extendsFrom testCompileOnly
    neoForgeTestRuntimeOnly.extendsFrom testRuntimeOnly
}

def battleMageProviderRuntimeEnabled = (findProperty('battleMageProviderRuntime') ?: 'false').toString().toBoolean()
def battleMageEpicRuntimeEnabled = (findProperty('battleMageEpicRuntime') ?: 'false').toString().toBoolean()

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // RPG progression providers.
    compileOnly "io.redspace:irons_spellbooks:${irons_spells_version}:api"
    // Battle Mage additionally compiles against the exact provider runtime JAR because the public
    // MagicData API exposes cooldown/sync types from that artifact. Keep the canonical :api
    // dependency above, but source the immutable complete 3.16.3 JAR from CurseForge so builds do
    // not depend on the Redspace runtime-artifact endpoint.
    compileOnly("curse.maven:irons-spells-n-spellbooks-855414:${irons_spells_file_id}") {
        transitive = false
    }
    compileOnly("maven.modrinth:TKB6INcv:${ars_nouveau_version_id}") {
        transitive = false
    }
    compileOnly("maven.modrinth:vu3NZ5Ma:${epicfight_version_id}") {
        transitive = false
    }
    compileOnly("curse.maven:goety-586095:${goety_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:malum-484064:${malum_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:eidolon-repraised-870250:${eidolon_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:identity2-1238155:${identity2_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:minecolonies-245506:${minecolonies_file_id}") {
        transitive = false
    }

    // Opt-in provider-present verification runtime. Normal dev/GameTest/server runs intentionally
    // stay provider-free so optional classloading remains covered. The Epic lane reuses this exact
    // certified provider base, then layers only the pack's combat/animation compatibility mods.
    if (battleMageProviderRuntimeEnabled || battleMageEpicRuntimeEnabled) {
        localRuntime("curse.maven:minecolonies-245506:${minecolonies_file_id}") {
            transitive = false
        }
        localRuntime "com.ldtteam:structurize:1.0.832-1.21.1-snapshot"
        localRuntime "com.ldtteam:blockui:1.0.199-1.21.1-snapshot"
        localRuntime "com.ldtteam:domum-ornamentum:1.0.223-snapshot"
        localRuntime "com.ldtteam:multipiston:1.2.51-1.21.1-snapshot"
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

        localRuntime("curse.maven:irons-spells-n-spellbooks-855414:${irons_spells_file_id}") {
            transitive = false
        }
        localRuntime "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.7.5.1"
        localRuntime "dev.kosmx.player-anim:player-animation-lib-forge:2.0.1+1.21.1"
        localRuntime "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
        localRuntime "io.redspace:irons_lib:1.21.1-2.1.0-SNAPSHOT"
    }

    if (battleMageEpicRuntimeEnabled) {
        localRuntime("maven.modrinth:vu3NZ5Ma:${epicfight_version_id}") {
            transitive = false
        }
        localRuntime("curse.maven:minecolonies-epicfied-epic-colonies-1610923:${epic_colonies_file_id}") {
            transitive = false
        }
        localRuntime("curse.maven:epic-fight-x-irons-spells-enhanced-animations-1109064:${efis_file_id}") {
            transitive = false
        }
    }

    // Native Volcanoes subsystem hosts. These remain optional at runtime.
    compileOnly('curse.maven:cold-sweat-506194:8302211') { transitive = false }
    compileOnly('curse.maven:create-rns-1370563:8729955') { transitive = false }
    compileOnly('curse.maven:sable-1312371:8673825') { transitive = false }
    compileOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    compileOnly('com.simibubi.create:create-1.21.1:6.0.10-280:slim') { transitive = false }
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    compileOnly('top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api') { transitive = false }

    testImplementation('curse.maven:cold-sweat-506194:8302211') { transitive = false }
    testImplementation("maven.modrinth:vu3NZ5Ma:${epicfight_version_id}") { transitive = false }
    testImplementation "net.neoforged:testframework:${neo_version}"
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation("curse.maven:irons-spells-n-spellbooks-855414:${irons_spells_file_id}") {
        transitive = false
    }
    testImplementation("curse.maven:minecolonies-245506:${minecolonies_file_id}") {
        transitive = false
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def epicFightAdapterCoverageTest = 'dev.gustavopere.rpgskilltree.runtime.compat.epicfight.A0031A0040EpicFight*CoverageJUnitTest'

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    extensions.configure(org.gradle.testing.jacoco.plugins.JacocoTaskExtension) { jacocoExtension ->
        // Instrument repository code only. Minecraft/NeoForge/provider bytecode is dependency code,
        // and instrumenting Blocks.<clinit> exceeds ASM's method-size limit under the JUnit server.
        jacocoExtension.includes = ['dev.gustavopere.*']
    }
}

tasks.named('test', Test).configure {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

// NeoGradle materializes the run-backed test task lazily. Keep its filter narrow.
tasks.matching { it.name == 'testJunit' }.configureEach {
    if (it instanceof Test) {
        filter {
            includeTestsMatching epicFightAdapterCoverageTest
        }
    }
}

// NeoGradle can rewrite Test inputs after ordinary task configuration. Rebind concrete compiler
// destinations only after the execution graph is final, before skip/no-source evaluation.
gradle.taskGraph.whenReady { graph ->
    Test plain = tasks.named('test', Test).get()
    if (graph.hasTask(plain)) {
        File plainDir = tasks.named('compileTestJava', JavaCompile).get().destinationDirectory.get().asFile
        plain.setTestClassesDirs(files(plainDir))
        plain.setClasspath(sourceSets.test.runtimeClasspath)
    }

    Task loadedCandidate = tasks.findByName('testJunit')
    if (loadedCandidate instanceof Test && graph.hasTask(loadedCandidate)) {
        File loadedDir = tasks.named('compileNeoForgeTestJava', JavaCompile).get().destinationDirectory.get().asFile
        ((Test) loadedCandidate).setTestClassesDirs(files(loadedDir))
    }
}

def verifyPlainJUnitExecution = tasks.register('verifyPlainJUnitExecution') {
    group = 'verification'
    description = 'Fails if the ordinary JUnit task was skipped as NO-SOURCE.'
    doLast {
        Test plain = tasks.named('test', Test).get()
        File classesDir = tasks.named('compileTestJava', JavaCompile).get().destinationDirectory.get().asFile
        int classCount = fileTree(classesDir).matching { include '**/*.class' }.files.size()
        if (plain.state.noSource) {
            throw new GradleException("JUnit gate failed: :test finished NO-SOURCE; compileTestJava destination=${classesDir}; compiledClasses=${classCount}; candidateClassFiles=${plain.candidateClassFiles.files.size()}; testClassesDirs=${plain.testClassesDirs.files}; taskIncludes=${plain.includes}; taskExcludes=${plain.excludes}.")
        }
    }
}

def verifyNeoForgeJUnitExecution = tasks.register('verifyNeoForgeJUnitExecution') {
    group = 'verification'
    description = 'Fails if the NeoForge-loaded JUnit task was skipped as NO-SOURCE.'
    doLast {
        Task candidate = tasks.findByName('testJunit')
        if (!(candidate instanceof Test)) {
            throw new GradleException('JUnit gate failed: :testJunit was not materialized as a Test task.')
        }
        File classesDir = tasks.named('compileNeoForgeTestJava', JavaCompile).get().destinationDirectory.get().asFile
        int classCount = fileTree(classesDir).matching { include '**/*.class' }.files.size()
        if (((Test) candidate).state.noSource) {
            Test loaded = (Test) candidate
            throw new GradleException("JUnit gate failed: :testJunit finished NO-SOURCE; compileNeoForgeTestJava destination=${classesDir}; compiledClasses=${classCount}; candidateClassFiles=${loaded.candidateClassFiles.files.size()}; testClassesDirs=${loaded.testClassesDirs.files}; taskIncludes=${loaded.includes}; taskExcludes=${loaded.excludes}.")
        }
    }
}

tasks.named('test', Test).configure {
    finalizedBy verifyPlainJUnitExecution
}

tasks.matching { it.name == 'testJunit' }.configureEach {
    finalizedBy verifyNeoForgeJUnitExecution
}

tasks.named('jacocoTestReport').configure {
    dependsOn tasks.named('test')
    dependsOn 'testJunit'
    executionData(
        layout.buildDirectory.file('jacoco/test.exec'),
        layout.buildDirectory.file('jacoco/testJunit.exec')
    )
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('test')
    dependsOn 'testJunit'
}

tasks.named('sonar').configure {
    dependsOn tasks.named('jacocoTestReport')
}

tasks.named('jar', Jar).configure {
    from('THIRD_PARTY_NOTICES.md')
    from('licenses/Volcanoes-BSD-2-Clause.txt') {
        into('META-INF/licenses')
    }
}

tasks.register('generateCombatPerkWikiSnapshot', JavaExec) {
    group = 'documentation'
    description = 'Regenera build/generated-wiki/combat-perks.json a partir do modelo canônico A0001-A0100.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gustavopere.rpgskilltree.tools.CombatPerkWikiSnapshotGenerator'
    args '--write'
}

tasks.register('checkCombatPerkWikiSnapshot', JavaExec) {
    group = 'verification'
    description = 'Falha se build/generated-wiki/combat-perks.json divergir do modelo canônico A0001-A0100.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gustavopere.rpgskilltree.tools.CombatPerkWikiSnapshotGenerator'
    args '--check'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        epicfight_version_range: epicfight_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
