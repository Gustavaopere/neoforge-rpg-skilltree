plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_file_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven {
        name = "Iron's Maven - Release"
        url = 'https://code.redspace.io/releases'
    }
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('runs').dir(name)
        modSource project.sourceSets.main
    }

    client {}
    server {}

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    junit {}

    data {
        arguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "io.redspace:irons_spellbooks:${irons_spells_version}:api"
    compileOnly("maven.modrinth:TKB6INcv:${ars_nouveau_version_id}") {
        transitive = false
    }
    compileOnly("maven.modrinth:vu3NZ5Ma:${epicfight_version_id}") {
        transitive = false
    }
    compileOnly("curse.maven:goety-586095:${goety_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:malum-484064:${malum_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:eidolon-repraised-870250:${eidolon_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:identity2-1238155:${identity2_file_id}") {
        transitive = false
    }
    compileOnly("curse.maven:minecolonies-245506:${minecolonies_file_id}") {
        transitive = false
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('generateCombatPerkWikiSnapshot', JavaExec) {
    group = 'documentation'
    description = 'Regenera build/generated-wiki/combat-perks.json a partir do modelo canônico A0001-A0100.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gustavopere.rpgskilltree.tools.CombatPerkWikiSnapshotGenerator'
    args '--write'
}

tasks.register('checkCombatPerkWikiSnapshot', JavaExec) {
    group = 'verification'
    description = 'Falha se build/generated-wiki/combat-perks.json divergir do modelo canônico A0001-A0100.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gustavopere.rpgskilltree.tools.CombatPerkWikiSnapshotGenerator'
    args '--check'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}