allprojects { project ->
    afterEvaluate {
        def enabled = (project.findProperty('arsProviderRuntime') ?: 'false').toString().toBoolean()
        if (!enabled) {
            return
        }

        def arsVersionId = project.findProperty('ars_nouveau_version_id')
        if (arsVersionId == null || arsVersionId.toString().isBlank()) {
            throw new GradleException('ars_nouveau_version_id is required for the Ars provider GameTest runtime')
        }

        // Match the current pack exactly. Ars remains optional outside this opt-in loaded-provider lane.
        project.dependencies.add('localRuntime', "maven.modrinth:TKB6INcv:${arsVersionId}") {
            transitive = false
        }
        project.dependencies.add('localRuntime', 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2')
        project.dependencies.add('localRuntime', 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1')
        project.dependencies.add('localRuntime', 'vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE')
    }
}
