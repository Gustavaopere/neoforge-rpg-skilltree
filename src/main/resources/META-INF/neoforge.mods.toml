modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Provider integrations are artifact-level optional. Runtime adapters remain classloading-safe
# when absent and apply their own exact compatibility gates. Use an explicit permissive Maven
# range here instead of an empty range: NeoForge 21.1.248 treated the explicit empty string as an
# unsatisfied optional dependency during provider-present verification.
[[dependencies.${mod_id}]]
modId="irons_spellbooks"
type="optional"
reason="Optional Iron's Spells 'n Spellbooks progression integration"
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ars_nouveau"
type="optional"
reason="Optional Ars Nouveau progression integration"
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="epicfight"
type="optional"
reason="Optional Epic Fight combat progression integration"
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
