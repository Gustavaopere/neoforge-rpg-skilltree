name: Query Sonar New Code issues

on:
  push:
    branches:
      - chore/repair-sonar-previous-version-baseline
    paths:
      - .github/workflows/query-sonar-new-code-issues.yml

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    env:
      SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
    steps:
      - name: List open or confirmed New Code issues on main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --get \
            -u "${SONAR_TOKEN}:" \
            --data-urlencode "componentKeys=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main' \
            --data-urlencode 'sinceLeakPeriod=true' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=100' \
            'https://sonarcloud.io/api/issues/search')"
          echo "TOTAL=$(jq -r '.paging.total // .total' <<<"$response")"
          jq -r '.issues[] | ["KEY=" + .key, "RULE=" + .rule, "SEVERITY=" + .severity, "TYPE=" + .type, "STATUS=" + .status, "COMPONENT=" + .component, "LINE=" + ((.line // 0)|tostring), "CREATED=" + .creationDate, "MESSAGE=" + .message] | join(" | ")' <<<"$response"
