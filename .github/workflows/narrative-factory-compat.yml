name: Narrative Factory Compatibility

on:
  pull_request:
    paths:
      - 'historia/03-npcs/**'
      - 'historia/11-ia-e-autoria/factory-narrative-profile.json'
      - 'historia/11-ia-e-autoria/16-factory-narrative-toolkit-integration.md'
      - '.github/workflows/narrative-factory-compat.yml'
  push:
    branches: [main]
    paths:
      - 'historia/03-npcs/**'
      - 'historia/11-ia-e-autoria/factory-narrative-profile.json'
      - '.github/workflows/narrative-factory-compat.yml'

permissions:
  contents: read

jobs:
  narrative-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACTORY_SHA: 99292829b25025b4cb7130a05a8221e0d7a5a19e
      PROFILE: historia/11-ia-e-autoria/factory-narrative-profile.json
      STORY_ROOT: historia/03-npcs/principais
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
      - name: Checkout pinned Factory
        uses: actions/checkout@v7
        with:
          repository: Gustavaopere/minecraft-mod-factory
          ref: ${{ env.FACTORY_SHA }}
          path: .factory-ci/factory
      - name: Validate real narrative slice
        shell: bash
        run: |
          set -euo pipefail
          python3 .factory-ci/factory/narrative/tooling/validate_story.py --profile "$PROFILE" --root "$STORY_ROOT"
          python3 .factory-ci/factory/narrative/tooling/validate_advanced.py --profile "$PROFILE" --root "$STORY_ROOT"
      - name: Inventory and neutral authority round-trip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .factory-ci/output
          python3 .factory-ci/factory/narrative/tooling/story_inventory.py --profile "$PROFILE" --root "$STORY_ROOT" --format json > .factory-ci/output/inventory.json
          python3 .factory-ci/factory/narrative/tooling/authority_reconcile.py export-inventory \
            --inventory .factory-ci/output/inventory.json \
            --output .factory-ci/output/github-authority.json \
            --source github:neoforge-rpg-skilltree \
            --revision "${GITHUB_SHA}" \
            --captured-at 2026-09-16T00:00:00Z
          python3 .factory-ci/factory/narrative/tooling/authority_reconcile.py compare \
            --local .factory-ci/output/github-authority.json \
            --external .factory-ci/output/github-authority.json \
            --required-external \
            --field title \
            --field state
