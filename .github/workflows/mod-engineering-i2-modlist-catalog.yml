name: Mod Engineering I2 Modlist Catalog

on:
  push:
    branches:
      - feat/mod-engineering-i2-modlist-catalog
  pull_request:
    paths:
      - 'PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/**'
      - 'PROJECT-INSTRUCTIONS/engineering/tooling/import-physical-modlist.py'
      - 'PROJECT-INSTRUCTIONS/engineering/tests/test_i2_modlist_catalog.py'
      - 'PROJECT-INSTRUCTIONS/engineering/tests/fixtures/modlist-i2-sample.txt'
      - '.github/workflows/mod-engineering-i2-modlist-catalog.yml'

permissions:
  contents: read

jobs:
  modlist-catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run I2 contract tests
        run: python3 -m unittest PROJECT-INSTRUCTIONS/engineering/tests/test_i2_modlist_catalog.py
      - name: Validate normalized physical snapshot
        run: python3 PROJECT-INSTRUCTIONS/engineering/tooling/import-physical-modlist.py --check PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/snapshot-2026-09-09.json
