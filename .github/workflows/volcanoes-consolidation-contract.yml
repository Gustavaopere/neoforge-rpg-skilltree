name: Volcanoes Consolidation Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore frozen standalone source from preserved bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="$PWD/docs/archive/volcanoes/standalone-git-history"
          SOURCE_DIR="$PWD/build/volcanoes-standalone-source"
          SOURCE_SHA='eaddc3232dfc600780769f4a5e7e45ff1e50181c'

          (cd "$BUNDLE_DIR" && sha256sum -c SHA256SUMS)
          git bundle verify "$BUNDLE_DIR/Volcanoes-full-history.bundle"
          rm -rf "$SOURCE_DIR"
          git clone --quiet --no-checkout "$BUNDLE_DIR/Volcanoes-full-history.bundle" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify single-mod consolidation contract
        run: python3 scripts/verify-volcanoes-consolidation.py
      - name: Verify standalone functional parity
        run: python3 scripts/verify-volcanoes-standalone-parity.py build/volcanoes-standalone-source
      - name: Verify completed Volcanoes plans are archived
        run: python3 scripts/verify-volcanoes-plan-archive.py
