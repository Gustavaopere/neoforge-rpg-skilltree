name: PR488 Bundle Bootstrap

on:
  push:
    branches:
      - feat/blockbench-modeling-rig-mutations
    paths:
      - 'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/core/project-model/project_model.js'
      - 'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/core/validator/validator.js'
      - 'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/live-bridge/project_snapshot.js'
      - 'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.locator_native.test.js'
      - '.github/workflows/pr488-bundle-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blockbench-modeling-rig-mutations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic Blockbench bundle
        run: node PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/build_toolkit_bundle.js --write
      - name: Verify Locator regression and bundle freshness
        run: |
          node PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.locator_native.test.js
          node PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/build_toolkit_bundle.js --check
      - name: Commit generated bundle and remove bootstrap
        run: |
          rm .github/workflows/pr488-bundle-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.js .github/workflows/pr488-bundle-bootstrap.yml
          git diff --cached --quiet && exit 0
          git commit -m 'build(blockbench): regenerate toolkit bundle after locator fix'
          git push origin HEAD:feat/blockbench-modeling-rig-mutations
