name: Volcanoes Full Pack Compatibility Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volcanoes-full-pack-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-pack-gametest-and-restart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Verify full-pack tooling
        shell: bash
        run: |
          set -euo pipefail
          jq --version
          python3 --version
          bash -n .github/scripts/volcanoes/install_full_pack_acceptance.sh
          bash -n .github/scripts/volcanoes/run_full_pack_smoke.sh
          python3 -m py_compile \
            .github/scripts/volcanoes/minecraft_rcon.py \
            .github/scripts/volcanoes/worldgen_site_digest.py

      - name: Install exact full-pack acceptance runtime
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/volcanoes/install_full_pack_acceptance.sh \
            "$PWD/build/full-pack-acceptance/mods" \
            "$PWD/build/full-pack-acceptance/metadata"

      - name: Prepare full-pack GameTest runtime
        shell: bash
        run: |
          set -euo pipefail
          RUN="$PWD/runs/gameTestServer"
          mkdir -p "$RUN/mods" "$RUN/kubejs/startup_scripts" "$PWD/build/full-pack-acceptance"
          rm -rf "$RUN/world"
          rm -f "$RUN/mods"/*.jar
          cp "$PWD/build/full-pack-acceptance/mods"/*.jar "$RUN/mods/"
          cp integration-templates/kubejs/startup_scripts/volcanoes_rns_worldgen.js \
            "$RUN/kubejs/startup_scripts/volcanoes_rns_worldgen.js"
          printf 'eula=true\n' > "$RUN/eula.txt"

      - name: Run full-pack exact-host GameTests
        shell: bash
        env:
          VOLCANOES_FULL_PACK_ACCEPTANCE: 'true'
        run: |
          set -euo pipefail
          gradle --no-daemon runGameTestServer 2>&1 \
            | tee "$PWD/build/full-pack-acceptance/gametest.log"
          grep -Eq 'All [0-9]+ required tests passed' "$PWD/build/full-pack-acceptance/gametest.log"

      - name: Prepare full-pack dedicated server
        shell: bash
        run: |
          set -euo pipefail
          RUN="$PWD/runs/server"
          mkdir -p "$RUN/mods" "$RUN/kubejs/startup_scripts"
          rm -f "$RUN/mods"/*.jar
          cp "$PWD/build/full-pack-acceptance/mods"/*.jar "$RUN/mods/"
          cp integration-templates/kubejs/startup_scripts/volcanoes_rns_worldgen.js \
            "$RUN/kubejs/startup_scripts/volcanoes_rns_worldgen.js"

      - name: Run full-pack save reload smoke
        shell: bash
        run: bash .github/scripts/volcanoes/run_full_pack_smoke.sh

      - name: Upload full-pack evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: volcanoes-full-pack-compatibility-${{ github.sha }}
          path: |
            build/full-pack-acceptance/
            runs/gameTestServer/logs/
            runs/gameTestServer/crash-reports/
            runs/server/logs/
            runs/server/crash-reports/
          if-no-files-found: warn
          retention-days: 14
