name: Blockbench MCP Sidecar

on:
  push:
    paths:
      - 'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/mcp-sidecar/**'
      - 'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/live-bridge/**'
      - '.github/workflows/blockbench-mcp-sidecar.yml'
  pull_request:
    paths:
      - 'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/mcp-sidecar/**'
      - 'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/live-bridge/**'
      - '.github/workflows/blockbench-mcp-sidecar.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/mcp-sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Static syntax check
        run: npm run check
      - name: Sidecar integration tests
        run: npm test
