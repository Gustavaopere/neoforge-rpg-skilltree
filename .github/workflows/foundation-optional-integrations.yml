name: Foundation Optional Integrations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: foundation-optional-integrations-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify optional integration isolation contract
        run: python3 scripts/verify-optional-integrations.py
