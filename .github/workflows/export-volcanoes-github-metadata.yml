name: Export Volcanoes GitHub metadata

on:
  push:
    branches:
      - archive/preserve-volcanoes-standalone-history

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Export standalone GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: Gustavaopere/Volcanoes
          OUT: docs/archive/volcanoes/standalone-github-metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/missing-pr-patches"

          gh api "repos/$SOURCE_REPO" > "$OUT/repository.json"
          gh api --paginate "repos/$SOURCE_REPO/pulls?state=all&per_page=100" | jq -c '.[]' > "$OUT/pulls.ndjson"
          gh api --paginate "repos/$SOURCE_REPO/issues?state=all&per_page=100" | jq -c '.[]' > "$OUT/issues-and-prs.ndjson"
          gh api --paginate "repos/$SOURCE_REPO/issues/comments?per_page=100" | jq -c '.[]' > "$OUT/issue-comments.ndjson"
          gh api --paginate "repos/$SOURCE_REPO/pulls/comments?per_page=100" | jq -c '.[]' > "$OUT/pull-review-comments.ndjson"
          gh api --paginate "repos/$SOURCE_REPO/issues/events?per_page=100" | jq -c '.[]' > "$OUT/issue-events.ndjson"
          gh api --paginate "repos/$SOURCE_REPO/releases?per_page=100" | jq -c '.[]' > "$OUT/releases.ndjson"
          gh api --paginate "repos/$SOURCE_REPO/milestones?state=all&per_page=100" | jq -c '.[]' > "$OUT/milestones.ndjson"
          gh api --paginate "repos/$SOURCE_REPO/labels?per_page=100" | jq -c '.[]' > "$OUT/labels.ndjson"
          gh api "repos/$SOURCE_REPO/actions/workflows?per_page=100" | jq -c '.workflows[]' > "$OUT/workflows.ndjson"
          gh api --paginate "repos/$SOURCE_REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | {id,name,workflow_id,head_branch,head_sha,event,status,conclusion,run_number,created_at,updated_at,html_url}' > "$OUT/workflow-runs.ndjson"
          gh api --paginate "repos/$SOURCE_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | {id,name,size_in_bytes,expired,created_at,expires_at,updated_at,archive_download_url,workflow_run}' > "$OUT/artifacts.ndjson"

          : > "$OUT/pull-details.ndjson"
          : > "$OUT/pull-reviews.ndjson"
          while IFS= read -r pr; do
            gh api "repos/$SOURCE_REPO/pulls/$pr" | jq -c '.' >> "$OUT/pull-details.ndjson"
            gh api --paginate "repos/$SOURCE_REPO/pulls/$pr/reviews?per_page=100" | jq -c --argjson pr "$pr" '.[] | . + {pull_number:$pr}' >> "$OUT/pull-reviews.ndjson"
          done < <(jq -r '.number' "$OUT/pulls.ndjson")

          history_dir="docs/archive/volcanoes/standalone-git-history"
          bundle="$history_dir/Volcanoes-full-history.bundle"
          test -f "$bundle"
          git bundle verify "$bundle" > "$OUT/BUNDLE_REVERIFY.txt" 2>&1
          rm -rf /tmp/volcanoes-history
          git clone -q "$bundle" /tmp/volcanoes-history

          : > "$OUT/missing-pr-heads.txt"
          : > "$OUT/missing-pr-bases.txt"
          while IFS=$'\t' read -r pr head base; do
            if ! git -C /tmp/volcanoes-history cat-file -e "$head^{commit}" 2>/dev/null; then
              printf '%s\t%s\n' "$pr" "$head" >> "$OUT/missing-pr-heads.txt"
              curl -fsSL "https://github.com/$SOURCE_REPO/pull/$pr.patch" -o "$OUT/missing-pr-patches/PR-$pr.patch"
            fi
            if ! git -C /tmp/volcanoes-history cat-file -e "$base^{commit}" 2>/dev/null; then
              printf '%s\t%s\n' "$pr" "$base" >> "$OUT/missing-pr-bases.txt"
            fi
          done < <(jq -r '[.number,.head.sha,.base.sha] | @tsv' "$OUT/pull-details.ndjson")

          pr_count=$(wc -l < "$OUT/pulls.ndjson" | tr -d ' ')
          issue_count=$(jq -c 'select(has("pull_request") | not)' "$OUT/issues-and-prs.ndjson" | wc -l | tr -d ' ')
          issue_comment_count=$(wc -l < "$OUT/issue-comments.ndjson" | tr -d ' ')
          review_comment_count=$(wc -l < "$OUT/pull-review-comments.ndjson" | tr -d ' ')
          review_count=$(wc -l < "$OUT/pull-reviews.ndjson" | tr -d ' ')
          workflow_run_count=$(wc -l < "$OUT/workflow-runs.ndjson" | tr -d ' ')
          artifact_count=$(wc -l < "$OUT/artifacts.ndjson" | tr -d ' ')
          active_artifact_count=$(jq -c 'select(.expired == false)' "$OUT/artifacts.ndjson" | wc -l | tr -d ' ')
          active_artifact_bytes=$(jq -r 'select(.expired == false) | .size_in_bytes' "$OUT/artifacts.ndjson" | awk '{s+=$1} END {print s+0}')
          missing_head_count=$(wc -l < "$OUT/missing-pr-heads.txt" | tr -d ' ')
          missing_base_count=$(wc -l < "$OUT/missing-pr-bases.txt" | tr -d ' ')
          patch_count=$(find "$OUT/missing-pr-patches" -type f -name '*.patch' | wc -l | tr -d ' ')

          cat > "$OUT/MANIFEST.md" <<EOF
          # Volcanoes standalone GitHub metadata archive

          Exported from \`Gustavaopere/Volcanoes\` immediately before repository deletion eligibility.

          - Pull requests: $pr_count
          - Standalone issues (excluding PRs): $issue_count
          - Issue/PR conversation comments: $issue_comment_count
          - Inline pull-request review comments: $review_comment_count
          - Pull-request review submissions: $review_count
          - Workflow-run summaries: $workflow_run_count
          - Artifact metadata records: $artifact_count
          - Non-expired artifact records: $active_artifact_count
          - Non-expired artifact bytes: $active_artifact_bytes
          - PR heads missing from the Git bundle: $missing_head_count
          - PR bases missing from the Git bundle: $missing_base_count
          - Fallback PR patches saved: $patch_count

          The Git bundle remains the primary source-code/history archive. This directory preserves GitHub-native metadata that a Git bundle does not contain. Workflow artifact binaries and hosted job logs are not copied; artifact metadata is retained, and source/workflow definitions remain recoverable from the Git bundle.
          EOF

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Verify metadata archive
        env:
          OUT: docs/archive/volcanoes/standalone-github-metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT/repository.json"
          test "$(wc -l < "$OUT/pulls.ndjson")" -eq 97
          test "$(jq -c 'select(has("pull_request") | not)' "$OUT/issues-and-prs.ndjson" | wc -l)" -eq 1
          test "$(wc -l < "$OUT/workflow-runs.ndjson")" -ge 3605
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Commit immutable metadata archive and remove exporter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/export-volcanoes-github-metadata.yml
          git add docs/archive/volcanoes/standalone-github-metadata
          git commit -m 'archive(volcanoes): preserve standalone GitHub metadata'
          git push
