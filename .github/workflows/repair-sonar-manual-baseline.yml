name: Repair Sonar manual baseline

on:
  push:
    branches:
      - chore/repair-sonar-previous-version-baseline
    paths:
      - .github/workflows/repair-sonar-manual-baseline.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
    steps:
      - name: Verify project New Code settings before repair
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SONAR_TOKEN:-}"
          response="$(curl -fsS -u "${SONAR_TOKEN}:" \
            --get 'https://sonarcloud.io/api/settings/values' \
            --data-urlencode "component=${SONAR_PROJECT}" \
            --data-urlencode 'keys=sonar.leak.period,sonar.leak.period.type')"
          period="$(jq -r '.settings[] | select(.key == "sonar.leak.period") | .value' <<<"$response")"
          period_type="$(jq -r '.settings[] | select(.key == "sonar.leak.period.type") | .value' <<<"$response")"
          echo "Project New Code settings before repair: period=${period}, type=${period_type}"
          test "$period" = 'previous_version'
          test "$period_type" = 'previous_version'

      - name: Remove manual New Code baseline from main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          http_code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -u "${SONAR_TOKEN}:" \
            -X POST 'https://sonarcloud.io/api/project_analyses/unset_baseline' \
            --data-urlencode "project=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main')"
          echo "unset_baseline HTTP status: ${http_code}"
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            cat "$body_file"
            exit 1
          fi
          if [[ -s "$body_file" ]]; then
            cat "$body_file"
          fi

      - name: Verify project New Code settings after repair
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl -fsS -u "${SONAR_TOKEN}:" \
            --get 'https://sonarcloud.io/api/settings/values' \
            --data-urlencode "component=${SONAR_PROJECT}" \
            --data-urlencode 'keys=sonar.leak.period,sonar.leak.period.type')"
          period="$(jq -r '.settings[] | select(.key == "sonar.leak.period") | .value' <<<"$response")"
          period_type="$(jq -r '.settings[] | select(.key == "sonar.leak.period.type") | .value' <<<"$response")"
          echo "Project New Code settings after repair: period=${period}, type=${period_type}"
          test "$period" = 'previous_version'
          test "$period_type" = 'previous_version'

      - name: Verify main analyses API is reachable
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -u "${SONAR_TOKEN}:" \
            --get 'https://sonarcloud.io/api/project_analyses/search' \
            --data-urlencode "project=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main' \
            --data-urlencode 'ps=1' \
            | jq -e '.analyses | type == "array"' >/dev/null
          echo 'Main analyses API reachable.'
