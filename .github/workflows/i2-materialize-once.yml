name: I2 Materialize Physical Catalog Once

on:
  push:
    branches:
      - feat/mod-engineering-i2-modlist-catalog
    paths:
      - 'PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/.i2payload.part.*'
      - '.github/workflows/i2-materialize-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          catalog='PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist'
          cat \
            "$catalog/.i2payload.part.00" \
            "$catalog/.i2payload.part.01" \
            "$catalog/.i2payload.part.02" \
            "$catalog/.i2payload.part.03" \
            > /tmp/i2payload.tar.xz
          echo '417bf7886490dc81edfb518ee5e6546eaf696a0fdb13d96d756e3732d228c59b  /tmp/i2payload.tar.xz' | sha256sum --check --strict

      - name: Extract canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          catalog='PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist'
          tar -xJf /tmp/i2payload.tar.xz -C "$catalog"

      - name: Validate I2 catalog
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest PROJECT-INSTRUCTIONS/engineering/tests/test_i2_modlist_catalog.py
          python3 PROJECT-INSTRUCTIONS/engineering/tooling/import-physical-modlist.py \
            --check PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/snapshot-2026-09-09.json \
            --providers PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/providers-2026-09-09.json

      - name: Verify exact materialization boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          catalog = Path('PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist')
          expected = {
              'providers-2026-09-09.json',
              *{f'snapshot-2026-09-09.entries.{start:04d}-{min(start + 99, 998):04d}.json' for start in range(0, 999, 100)},
          }
          missing = sorted(name for name in expected if not (catalog / name).is_file())
          if missing:
              raise SystemExit('missing materialized files: ' + ', '.join(missing))
          payload_entries = {p.name for p in catalog.glob('snapshot-2026-09-09.entries.*.json')}
          if payload_entries != expected - {'providers-2026-09-09.json'}:
              raise SystemExit(f'unexpected shard set: {sorted(payload_entries)}')
          PY

      - name: Commit materialized artifacts atomically
        shell: bash
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced concurrently: expected $GITHUB_SHA, found $remote_sha" >&2
            exit 1
          fi

          catalog='PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist'
          rm -f \
            "$catalog/.i2payload.part.00" \
            "$catalog/.i2payload.part.01" \
            "$catalog/.i2payload.part.02" \
            "$catalog/.i2payload.part.03" \
            .github/workflows/i2-materialize-once.yml \
            "$catalog/_probe.txt"

          find PROJECT-INSTRUCTIONS/engineering -type d -name __pycache__ -prune -exec rm -rf {} +

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          python3 - <<'PY'
          import subprocess
          allowed_added = {
              'PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/providers-2026-09-09.json',
              *{
                  f'PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/snapshot-2026-09-09.entries.{start:04d}-{min(start + 99, 998):04d}.json'
                  for start in range(0, 999, 100)
              },
          }
          allowed_deleted = {
              '.github/workflows/i2-materialize-once.yml',
              'PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/_probe.txt',
              *{
                  f'PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/.i2payload.part.{part:02d}'
                  for part in range(4)
              },
          }
          unexpected = []
          for raw in subprocess.check_output(['git', 'diff', '--cached', '--name-status'], text=True).splitlines():
              status, path = raw.split('\t', 1)
              if status == 'A' and path in allowed_added:
                  continue
              if status == 'D' and path in allowed_deleted:
                  continue
              unexpected.append(raw)
          if unexpected:
              raise SystemExit('unexpected staged changes: ' + repr(unexpected))
          PY

          git commit -m 'feat(engineering): materialize I2 physical modlist catalog'

          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced during materialization: expected $GITHUB_SHA, found $remote_sha" >&2
            exit 1
          fi
          git push origin "HEAD:$branch"
