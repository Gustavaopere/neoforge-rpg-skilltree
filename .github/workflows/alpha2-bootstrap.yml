name: Alpha 2 Snapshot Bootstrap

on:
  push:
    branches:
      - feat/alpha2-runtime
    paths:
      - .github/workflows/alpha2-bootstrap.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .alpha2-package/part-00.b64 \
            .alpha2-package/part-01.b64 \
            .alpha2-package/part-02.b64 \
            .alpha2-package/part-03.b64 \
            .alpha2-package/part-04.b64 \
            .alpha2-package/part-05.b64 \
            .alpha2-package/part-06.b64 \
            .alpha2-package/part-07.b64 \
            .alpha2-package/part-08.b64 \
            .alpha2-package/part-09.b64 \
            .alpha2-package/part-10a.b64 \
            .alpha2-package/part-10b.b64 \
            .alpha2-package/part-11a.b64 \
            .alpha2-package/part-11b.b64 \
            .alpha2-package/part-12a.b64 \
            .alpha2-package/part-12b.b64 \
            .alpha2-package/part-13.b64 \
            | tr -d '\r\n' > /tmp/alpha2-source.b64
          base64 --decode /tmp/alpha2-source.b64 > /tmp/alpha2-source.tar.xz
          test "$(stat -c%s /tmp/alpha2-source.tar.xz)" -eq 83120
          echo "c9bba2b5e229a91dbb378301f296f973c2496e791ac629abe50be03e9db56f94  /tmp/alpha2-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/alpha2-source.tar.xz -C .

      - name: Regenerate derived skill-tree data
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-tree-skeleton.py
          python3 scripts/export-passive-tree.py
          python3 scripts/export-client-tree.py
          python3 scripts/export-client-classes.py
          python3 scripts/export-client-choices.py
          python3 scripts/generate-node-effects.py
          python3 scripts/generate-warlock-subtree.py
          python3 scripts/generate-morph-subtrees.py

      - name: Verify reconstructed snapshot
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-core.sh
          python3 scripts/validate-data.py
          python3 scripts/validate-client-tree.py
          python3 scripts/validate-node-effects.py
          python3 scripts/validate-passive-export.py
          python3 scripts/verify-runtime-scaffold.py

      - name: Replace staging with normal source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .alpha2-package
          rm -f .github/workflows/alpha2-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize Alpha 2 runtime snapshot"
          git push origin HEAD:feat/alpha2-runtime
