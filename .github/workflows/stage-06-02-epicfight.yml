name: Stage 06.02 Epic Fight

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/java/dev/gustavopere/rpgskilltree/runtime/AuthoritativeHitAttributionBridge.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/runtime/events/A0081A0100CombatEvents.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/epicfight/**'
      - 'src/test/java/dev/gustavopere/rpgskilltree/runtime/AuthoritativeHitAttributionBridgeJUnitTest.java'
      - 'src/test/java/dev/gustavopere/rpgskilltree/runtime/events/A0081A0100HitAuthorityJUnitTest.java'
      - 'src/test/java/dev/gustavopere/rpgskilltree/runtime/compat/epicfight/**'
      - 'src/main/resources/data/rpgskilltree/node_effects/epicfight.json'
      - 'plans/06-integrations/**'
      - '.github/workflows/stage-06-02-epicfight.yml'
  workflow_dispatch:

concurrency:
  group: stage-06-02-epicfight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Verify Stage 06.02 contract
        run: >-
          ./gradlew --no-daemon test
          --tests '*EpicFightIntegrationContractJUnitTest'
          --tests '*AuthoritativeHitAttributionBridgeJUnitTest'
          --tests '*A0081A0100HitAuthorityJUnitTest'
          --tests '*EpicFightHitAuthorityCallbackJUnitTest'
