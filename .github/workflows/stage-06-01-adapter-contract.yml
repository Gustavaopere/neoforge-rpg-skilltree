name: Stage 06.01 Adapter Contract

on:
  pull_request:
    branches:
      - main

concurrency:
  group: stage-06-01-adapter-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Stage 06.01 contract regression
        run: ./gradlew --no-daemon test --tests 'dev.gustavopere.rpgskilltree.runtime.compat.IntegrationAdapterContractJUnitTest'
