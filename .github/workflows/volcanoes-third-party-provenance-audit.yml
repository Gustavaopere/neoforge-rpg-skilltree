name: Volcanoes Third-Party Provenance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volcanoes-third-party-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate imported provenance evidence
        run: python3 scripts/verify-volcanoes-import-provenance.py

      - name: Build unified artifact
        run: ./gradlew --no-daemon build

      - name: Audit unified JAR legal payload
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'RPGSkillTree*.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" > build/volcanoes-unified-jar-entries.txt
          grep -Fxq 'META-INF/licenses/Volcanoes-BSD-2-Clause.txt' build/volcanoes-unified-jar-entries.txt
          grep -Fxq 'THIRD_PARTY_NOTICES.md' build/volcanoes-unified-jar-entries.txt
          test "$(grep -c '^META-INF/neoforge.mods.toml$' build/volcanoes-unified-jar-entries.txt)" -eq 1
          if jar tf "$JAR" | grep -Eq '(^|/)Volcanoes[^/]*\.jar$|META-INF/jarjar/.+[Vv]olcanoes.+\.jar$'; then
            echo 'Nested/second Volcanoes JAR detected in unified artifact' >&2
            exit 1
          fi
          mkdir -p build/volcanoes-provenance-jar
          cd build/volcanoes-provenance-jar
          jar xf "../libs/$(basename "$JAR")" META-INF/neoforge.mods.toml
          test "$(grep -c '^\[\[mods\]\]' META-INF/neoforge.mods.toml)" -eq 1
          ! grep -Fq 'modId="volcanoes"' META-INF/neoforge.mods.toml
          echo "VOLCANOES_UNIFIED_JAR_PROVENANCE status=GREEN jar=$(basename "$JAR")"

      - name: Upload provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volcanoes-provenance-${{ github.sha }}
          path: |
            build/volcanoes-unified-jar-entries.txt
            build/volcanoes-provenance-jar/META-INF/neoforge.mods.toml
          if-no-files-found: warn
          retention-days: 14
