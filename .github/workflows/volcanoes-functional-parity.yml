name: Volcanoes Functional Parity Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volcanoes-functional-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-source-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidated RPG repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen standalone Volcanoes source
        uses: actions/checkout@v4
        with:
          repository: Gustavaopere/Volcanoes
          ref: eaddc3232dfc600780769f4a5e7e45ff1e50181c
          path: build/volcanoes-standalone-source
          fetch-depth: 1

      - name: Verify functional file parity
        run: python3 scripts/verify-volcanoes-functional-parity.py build/volcanoes-standalone-source
