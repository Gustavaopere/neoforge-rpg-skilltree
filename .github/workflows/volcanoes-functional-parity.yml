name: Volcanoes Functional Parity Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volcanoes-functional-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-source-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidated RPG repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore frozen standalone source from preserved bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="$PWD/docs/archive/volcanoes/standalone-git-history"
          SOURCE_DIR="$PWD/build/volcanoes-standalone-source"
          SOURCE_SHA='eaddc3232dfc600780769f4a5e7e45ff1e50181c'

          (cd "$BUNDLE_DIR" && sha256sum -c SHA256SUMS)
          git bundle verify "$BUNDLE_DIR/Volcanoes-full-history.bundle"
          rm -rf "$SOURCE_DIR"
          git clone --quiet --no-checkout "$BUNDLE_DIR/Volcanoes-full-history.bundle" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify functional file parity
        run: python3 scripts/verify-volcanoes-functional-parity.py build/volcanoes-standalone-source
