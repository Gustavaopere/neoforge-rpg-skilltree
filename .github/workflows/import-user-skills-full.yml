name: Import staged Minecraft skills bundle

on:
  push:
    branches:
      - chore/import-user-minecraft-skills-full
    paths:
      - '.github/workflows/import-user-skills-full.yml'

permissions:
  contents: write

jobs:
  import-skills:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: chore/import-user-minecraft-skills-full
          fetch-depth: 0

      - name: Reconstruct exact staged bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, gzip, io, tarfile
          parts=[Path(f'.skill-import/part-{i:03d}.b64') for i in range(14)]
          missing=[str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit('missing staged parts: '+repr(missing))
          encoded=''.join(''.join(p.read_text(encoding='utf-8-sig').split()) for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          data=gzip.decompress(raw)
          tf=tarfile.open(fileobj=io.BytesIO(data), mode='r:')
          names=tf.getnames()
          bad=[]
          skill_dirs=set()
          for name in names:
              pp=PurePosixPath(name)
              if pp.is_absolute() or '..' in pp.parts:
                  bad.append(name)
              if pp.name == 'SKILL.md':
                  skill_dirs.add(str(pp.parent))
          if bad:
              raise SystemExit('unsafe archive paths: '+repr(bad[:20]))
          if len(skill_dirs) != 20:
              raise SystemExit(f'expected 20 skill dirs, got {len(skill_dirs)}')
          Path('/tmp/fullskills.tar.gz').write_bytes(raw)
          print('archive members',len(names),'skill dirs',len(skill_dirs))
          PY
          gzip -t /tmp/fullskills.tar.gz

      - name: Extract into canonical skill library
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fullskills
          mkdir -p /tmp/fullskills
          tar -xzf /tmp/fullskills.tar.gz -C /tmp/fullskills
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('/tmp/fullskills')
          candidates=sorted({p.parent.resolve():p.parent for p in root.rglob('SKILL.md')}.values(), key=lambda p:p.name)
          if len(candidates)!=20 or len({p.name for p in candidates})!=20:
              raise SystemExit(f'expected 20 unique skills, got {[p.name for p in candidates]}')
          dst=Path('PROJECT-INSTRUCTIONS/skills/library')
          dst.mkdir(parents=True,exist_ok=True)
          for skill in candidates:
              target=dst/skill.name
              target.mkdir(parents=True,exist_ok=True)
              for item in skill.rglob('*'):
                  rel=item.relative_to(skill)
                  out=target/rel
                  if item.is_dir(): out.mkdir(parents=True,exist_ok=True)
                  elif item.is_file():
                      out.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(item,out)
          Path('/tmp/imported-skills.txt').write_text('\n'.join(p.name for p in candidates)+'\n',encoding='utf-8')
          PY

      - name: Validate imported payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names=[x for x in Path('/tmp/imported-skills.txt').read_text().splitlines() if x]
          root=Path('PROJECT-INSTRUCTIONS/skills/library')
          rows=[]
          total=0
          for name in names:
              d=root/name
              files=[p for p in d.rglob('*') if p.is_file() and p.name!='PROJECT-OVERLAY.md']
              if not (d/'SKILL.md').is_file(): raise SystemExit(f'{name}: missing SKILL.md')
              total += len(files)
              rows.append((name,len(files),sum(p.stat().st_size for p in files)))
          if len(names)!=20: raise SystemExit(f'expected 20 skills, got {len(names)}')
          if total!=142: raise SystemExit(f'expected 142 source files, got {total}')
          report=['# Full user skill bundle import','',f'- Imported skills: **{len(names)}**',f'- Source files validated: **{total}/142**','', '| Skill | Source files | Bytes |','|---|---:|---:|']
          report += [f'| `{n}` | {fc} | {sz} |' for n,fc,sz in rows]
          report += ['', '> The user-provided source payload is preserved; project-specific overlays remain separate as `PROJECT-OVERLAY.md`.','']
          Path('PROJECT-INSTRUCTIONS/skills/FULL-USER-SKILL-IMPORT.md').write_text('\n'.join(report),encoding='utf-8')
          PY

      - name: Remove staging and importer
        shell: bash
        run: |
          rm -rf .skill-import
          rm -f .github/workflows/import-user-skills-full.yml

      - name: Commit imported skill bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A PROJECT-INSTRUCTIONS/skills/library PROJECT-INSTRUCTIONS/skills/FULL-USER-SKILL-IMPORT.md .skill-import .github/workflows/import-user-skills-full.yml
          git commit -m 'chore(skills): import full user-provided skill bundles'
          git push origin HEAD:chore/import-user-minecraft-skills-full
