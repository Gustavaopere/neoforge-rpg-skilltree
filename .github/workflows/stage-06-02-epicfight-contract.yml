name: Stage 06.02 Epic Fight Contract

on:
  pull_request:
    branches:
      - main

concurrency:
  group: stage-06-02-epicfight-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run Stage 06.02 hit-authority regression
        run: >-
          ./gradlew --no-daemon test
          --tests 'dev.gustavopere.rpgskilltree.runtime.AuthoritativeHitAttributionBridgeJUnitTest'
          --tests 'dev.gustavopere.rpgskilltree.runtime.events.A0081A0100HitAuthorityJUnitTest'
