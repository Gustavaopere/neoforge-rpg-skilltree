name: Foundation Diagnostics Contract

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: foundation-diagnostics-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify diagnostics and testing contract
        run: python3 scripts/verify-foundation-diagnostics.py
