name: Diagnose Sonar Branch New Code Override

on:
  push:
    branches:
      - chore/repair-sonar-previous-version-baseline

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Inspect New Code periods
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "project=${SONAR_PROJECT}" \
            'https://sonarcloud.io/api/new_code_periods/list')"
          jq '.' <<<"$response"

      - name: Remove one-shot diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-sonar-new-code-branch.yml
          git commit -m 'chore: remove one-shot Sonar branch diagnostic'
          git push
