name: Compendium Ecology CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'docs/**'
  pull_request:

jobs:
  ecology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compendium ecology tests
        run: bash scripts/compendium/test_ecology.sh
