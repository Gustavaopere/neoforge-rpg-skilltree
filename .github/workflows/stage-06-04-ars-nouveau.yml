name: Stage 06.04 Ars Nouveau

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/java/dev/gustavopere/rpgskilltree/RpgSkillTreeMod.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/OptionalIntegrationAdapterRegistry.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/ars/**'
      - 'src/test/java/dev/gustavopere/rpgskilltree/runtime/compat/OptionalIntegrationAdapterRegistryJUnitTest.java'
      - 'src/test/java/dev/gustavopere/rpgskilltree/runtime/compat/ars/**'
      - '.github/gradle/ars-provider-runtime.init.gradle'
      - 'scripts/verify-ars-provider-runtime.py'
      - 'build.gradle'
      - 'gradle.properties'
      - 'plans/06-integrations/**'
      - '.github/workflows/stage-06-04-ars-nouveau.yml'
  workflow_dispatch:

concurrency:
  group: stage-06-04-ars-nouveau-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Verify Stage 06.04 unit contracts
        run: >-
          ./gradlew --no-daemon test
          --tests '*ArsNouveauVersionContractJUnitTest'
          --tests '*OptionalIntegrationAdapterRegistryJUnitTest'
          --tests '*ArsMasteryCausalityJUnitTest'

  provider-present:
    name: provider-present (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode:
          - ars-only
          - ars-irons
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run exact provider-present GameTests
        shell: bash
        env:
          ARS_PROVIDER_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mkdir -p build
          LOG="$PWD/build/ars-provider-${ARS_PROVIDER_MODE}.log"
          rm -f "$LOG"
          set +e
          ./gradlew --no-daemon -I .github/gradle/ars-provider-runtime.init.gradle runGameTestServer >"$LOG" 2>&1
          GRADLE_STATUS=$?
          set -e
          cat "$LOG"
          if [[ "$GRADLE_STATUS" -ne 0 ]]; then
            echo "Ars provider-present GameTest invocation failed with status $GRADLE_STATUS"
            exit "$GRADLE_STATUS"
          fi
          python3 scripts/verify-ars-provider-runtime.py "$ARS_PROVIDER_MODE" "$LOG"

      - name: Upload provider-present log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ars-provider-${{ matrix.mode }}-log
          path: build/ars-provider-${{ matrix.mode }}.log
          if-no-files-found: ignore
