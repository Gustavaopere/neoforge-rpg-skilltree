name: Stage 06.04 Ars Nouveau

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/java/dev/gustavopere/rpgskilltree/RpgSkillTreeMod.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/ars/**'
      - 'src/test/java/dev/gustavopere/rpgskilltree/runtime/compat/ars/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'plans/06-integrations/**'
      - '.github/workflows/stage-06-04-ars-nouveau.yml'
  workflow_dispatch:

concurrency:
  group: stage-06-04-ars-nouveau-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Verify Stage 06.04 version contract
        run: ./gradlew --no-daemon test --tests '*ArsNouveauVersionContractJUnitTest'
