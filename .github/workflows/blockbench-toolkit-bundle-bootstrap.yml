name: Blockbench Toolkit Bundle Bootstrap

on:
  push:
    branches:
      - feat/blockbench-readonly-live-bridge
    paths:
      - '.github/workflows/blockbench-toolkit-bundle-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/blockbench-readonly-live-bridge
          fetch-depth: 1
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate deterministic standalone bundle
        run: node PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/build_toolkit_bundle.js --write
      - name: Verify generated bundle
        run: node PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/build_toolkit_bundle.js --check
      - name: Commit bundle and remove bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.js
          git rm .github/workflows/blockbench-toolkit-bundle-bootstrap.yml
          git commit -m "build(blockbench): regenerate live bridge toolkit bundle"
          git push origin HEAD:feat/blockbench-readonly-live-bridge
