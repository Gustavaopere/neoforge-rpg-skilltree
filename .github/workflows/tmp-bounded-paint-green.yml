name: Temporary Bounded Paint Green

on:
  push:
    branches:
      - feat/blockbench-bounded-paint-region
    paths:
      - .github/workflows/tmp-bounded-paint-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/blockbench-bounded-paint-region
          fetch-depth: 0

      - name: Apply minimal bounded paint production patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/core/uv-texture/uv_texture_engine.js')
          adapter_path = Path('PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/blockbench-plugin/uv_texture_adapter.js')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          core = core_path.read_text()
          core = replace_once(
              core,
              "  texture_replace_palette: new Set(['type', 'textureId', 'region', 'replacements']),\n  texture_create: new Set(['type', 'name', 'width', 'height']),",
              "  texture_replace_palette: new Set(['type', 'textureId', 'region', 'replacements']),\n  texture_paint_region: new Set(['type', 'textureId', 'region', 'pixels']),\n  texture_create: new Set(['type', 'name', 'width', 'height']),",
              'core allowlist',
          )
          core = replace_once(
              core,
              "    case 'texture_replace_palette':\n      return Object.freeze({\n        type,\n        textureId: boundedString(value.textureId, `operations[${index}].textureId`),\n        region: pixelRegion(value.region, `operations[${index}].region`),\n        replacements: paletteReplacements(value.replacements, `operations[${index}].replacements`),\n      });\n    case 'texture_create':",
              "    case 'texture_replace_palette':\n      return Object.freeze({\n        type,\n        textureId: boundedString(value.textureId, `operations[${index}].textureId`),\n        region: pixelRegion(value.region, `operations[${index}].region`),\n        replacements: paletteReplacements(value.replacements, `operations[${index}].replacements`),\n      });\n    case 'texture_paint_region': {\n      const region = pixelRegion(value.region, `operations[${index}].region`);\n      const area = pixelArea(region, `operations[${index}].region`);\n      if (!Array.isArray(value.pixels) || value.pixels.length !== area) {\n        fail('PAINT_PIXEL_COUNT_MISMATCH', `operations[${index}].pixels must contain exactly ${area} row-major RGBA pixels.`);\n      }\n      const pixels = Object.freeze(value.pixels.map((pixel, pixelIndex) =>\n        rgba(pixel, `operations[${index}].pixels[${pixelIndex}]`)));\n      return Object.freeze({\n        type,\n        textureId: boundedString(value.textureId, `operations[${index}].textureId`),\n        region,\n        pixels,\n      });\n    }\n    case 'texture_create':",
              'core validation',
          )
          core = replace_once(
              core,
              "  if (operation.type === 'texture_replace_palette') return pixelArea(operation.region, `operations[${index}].region`);\n  if (operation.type === 'texture_create')",
              "  if (operation.type === 'texture_replace_palette') return pixelArea(operation.region, `operations[${index}].region`);\n  if (operation.type === 'texture_paint_region') return pixelArea(operation.region, `operations[${index}].region`);\n  if (operation.type === 'texture_create')",
              'core pixel accounting',
          )
          core_path.write_text(core)

          adapter = adapter_path.read_text()
          adapter = replace_once(
              adapter,
              "  function regionFor(operation) {\n    if (operation.type === 'texture_replace_palette') return operation.region;\n    return operation;\n  }",
              "  function regionFor(operation) {\n    if (operation.type === 'texture_replace_palette' || operation.type === 'texture_paint_region') return operation.region;\n    return operation;\n  }",
              'adapter region routing',
          )
          adapter = replace_once(
              adapter,
              "        case 'texture_fill_rect':\n        case 'texture_replace_palette': {",
              "        case 'texture_fill_rect':\n        case 'texture_replace_palette':\n        case 'texture_paint_region': {",
              'adapter preflight allowlist',
          )
          adapter = replace_once(
              adapter,
              "  function colorKey(color) {\n    return (((color[0] * 256 + color[1]) * 256 + color[2]) * 256 + color[3]);\n  }\n\n  function applyPalette(texture, operation) {",
              "  function applyPaintRegion(texture, operation) {\n    const {x, y, width, height} = operation.region;\n    const image = texture.ctx.getImageData(x, y, width, height);\n    operation.pixels.forEach((pixel, index) => {\n      const offset = index * 4;\n      image.data[offset] = pixel[0];\n      image.data[offset + 1] = pixel[1];\n      image.data[offset + 2] = pixel[2];\n      image.data[offset + 3] = pixel[3];\n    });\n    texture.ctx.putImageData(image, x, y);\n  }\n\n  function colorKey(color) {\n    return (((color[0] * 256 + color[1]) * 256 + color[2]) * 256 + color[3]);\n  }\n\n  function applyPalette(texture, operation) {",
              'adapter paint implementation',
          )
          adapter = replace_once(
              adapter,
              "      case 'texture_replace_palette': {\n        const texture = requireEditableTexture(requireTexture(operation.textureId));\n        applyPalette(texture, operation);\n        dirtyTextures.add(texture);\n        return texture.uuid || texture.id;\n      }\n      case 'texture_create': {",
              "      case 'texture_replace_palette': {\n        const texture = requireEditableTexture(requireTexture(operation.textureId));\n        applyPalette(texture, operation);\n        dirtyTextures.add(texture);\n        return texture.uuid || texture.id;\n      }\n      case 'texture_paint_region': {\n        const texture = requireEditableTexture(requireTexture(operation.textureId));\n        applyPaintRegion(texture, operation);\n        dirtyTextures.add(texture);\n        return texture.uuid || texture.id;\n      }\n      case 'texture_create': {",
              'adapter apply operation',
          )
          adapter_path.write_text(adapter)
          PY

      - name: Run bounded paint targeted regression
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit
        run: node --test rpg_asset_toolkit.texture_paint_region.test.js

      - name: Regenerate standalone bundle
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit
        run: node build_toolkit_bundle.js --write

      - name: Verify deterministic standalone
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit
        run: node build_toolkit_bundle.js --check

      - name: Run aggregate toolkit regression
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit
        run: node --test rpg_asset_toolkit.test.js

      - name: Verify repository validator
        run: python3 PROJECT-INSTRUCTIONS/skills/scripts/validate_skill_repository.py

      - name: Commit tested bounded paint production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-bounded-paint-green.yml
          git add \
            PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/core/uv-texture/uv_texture_engine.js \
            PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/blockbench-plugin/uv_texture_adapter.js \
            PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.js
          python3 - <<'PY'
          import subprocess
          expected = sorted([
              '.github/workflows/tmp-bounded-paint-green.yml',
              'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/blockbench-plugin/uv_texture_adapter.js',
              'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/core/uv-texture/uv_texture_engine.js',
              'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.js',
          ])
          actual = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged paths: {actual!r}')
          PY
          git commit -m 'feat(blockbench): add bounded texture paint region'
          git push origin HEAD:feat/blockbench-bounded-paint-region
