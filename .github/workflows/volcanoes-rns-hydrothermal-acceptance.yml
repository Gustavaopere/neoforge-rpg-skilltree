name: Volcanoes RNS Hydrothermal Acceptance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volcanoes-rns-hydrothermal-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-host-gametest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install exact RNS ownership runtime
        shell: bash
        run: |
          set -euo pipefail
          RUN="$PWD/runs/gameTestServer"
          MODS="$RUN/mods"
          KUBEJS="$RUN/kubejs/startup_scripts"
          mkdir -p "$MODS" "$KUBEJS"
          rm -rf "$RUN/world"
          rm -f "$MODS"/*.jar
          printf 'eula=true\n' > "$RUN/eula.txt"
          cat > "$RUN/server.properties" <<'EOF'
          initial-enabled-packs=vanilla
          initial-disabled-packs=create_rns:no_deposit_worldgen,create_rns:rare_deposit_worldgen,create_rns:standard_deposit_worldgen,create_rns:frequent_deposit_worldgen,create_rns:very_frequent_deposit_worldgen
          EOF

          curl --fail --location --retry 3 \
            'https://maven.createmod.net/com/simibubi/create/create-1.21.1/6.0.10-280/create-1.21.1-6.0.10-280.jar' \
            --output "$MODS/create-1.21.1-6.0.10-280.jar"
          curl --fail --location --retry 3 \
            'https://maven.createmod.net/net/createmod/ponder/ponder-neoforge/1.0.82+mc1.21.1/ponder-neoforge-1.0.82+mc1.21.1.jar' \
            --output "$MODS/ponder-neoforge-1.0.82+mc1.21.1.jar"
          curl --fail --location --retry 3 \
            'https://maven.latvian.dev/releases/dev/latvian/mods/rhino/2101.2.7-build.81/rhino-2101.2.7-build.81.jar' \
            --output "$MODS/rhino-2101.2.7-build.81.jar"
          curl --fail --location --retry 3 \
            'https://maven.latvian.dev/releases/dev/latvian/mods/kubejs-neoforge/2101.7.2-build.368/kubejs-neoforge-2101.7.2-build.368.jar' \
            --output "$MODS/kubejs-neoforge-2101.7.2-build.368.jar"
          curl --fail --location --retry 3 \
            'https://www.cursemaven.com/curse/maven/create-rns-1370563/8729955/create-rns-1370563-8729955.jar' \
            --output "$MODS/create_rns-1.3.1-1.21.1-6.jar"

          cp integration-templates/kubejs/startup_scripts/volcanoes_rns_worldgen.js \
            "$KUBEJS/volcanoes_rns_worldgen.js"

          for jar in "$MODS"/*.jar; do
            jar tf "$jar" >/dev/null
          done
          unzip -p "$MODS/create_rns-1.3.1-1.21.1-6.jar" META-INF/neoforge.mods.toml \
            | grep -E 'version[[:space:]]*=[[:space:]]*"1\.3\.1-1\.21\.1-6"'
          unzip -p "$MODS/kubejs-neoforge-2101.7.2-build.368.jar" META-INF/neoforge.mods.toml \
            | grep -E 'version[[:space:]]*=[[:space:]]*"2101\.7\.2-build\.368"'

      - name: Run exact-host RNS hydrothermal GameTests
        run: gradle --no-daemon runGameTestServer
