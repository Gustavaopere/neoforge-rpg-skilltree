name: Blockbench MCP Lock Bootstrap

on:
  push:
    branches:
      - feat/blockbench-readonly-live-bridge
    paths:
      - .github/workflows/blockbench-mcp-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/blockbench-readonly-live-bridge
          fetch-depth: 1
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate deterministic npm lock
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/mcp-sidecar
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock and remove bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/mcp-sidecar/package-lock.json
          git rm .github/workflows/blockbench-mcp-lock-bootstrap.yml
          git commit -m "build(blockbench): pin MCP sidecar dependency lock"
          git push origin HEAD:feat/blockbench-readonly-live-bridge
