name: Sonar New Code Diagnostic

on:
  push:
    branches:
      - chore/sonar-new-code-diagnostic

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose SonarCloud new issue classification
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail

          auth="Authorization: Bearer ${SONAR_TOKEN}"
          sonar="https://sonarcloud.io"

          echo '=== Persisted new-code settings ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/settings/values?component=${SONAR_PROJECT}&keys=sonar.leak.period,sonar.leak.period.type" \
            | jq '{settings: [.settings[] | {key, value, inherited}]}'

          echo '=== Setting definitions exposed by SonarCloud ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/settings/list_definitions?component=${SONAR_PROJECT}" \
            | jq '{definitions: [.definitions[] | select(.key == "sonar.leak.period" or .key == "sonar.leak.period.type") | {key, name, description, type, defaultValue, options, category, subCategory}]}'

          echo '=== Latest main analyses ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/project_analyses/search?project=${SONAR_PROJECT}&branch=main&ps=10" \
            | jq '{analyses: [.analyses[] | {key, date, projectVersion, revision, manualNewCodePeriodBaseline, events}]}'

          echo '=== Fetch current New Code issues ==='
          page1="$(curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&inNewCodePeriod=true&issueStatuses=OPEN,CONFIRMED&ps=500&p=1")"
          total="$(echo "$page1" | jq -r '.paging.total // .total')"
          if [ "$total" -gt 500 ]; then
            page2="$(curl --silent --show-error --fail --location \
              --header "$auth" \
              "$sonar/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&inNewCodePeriod=true&issueStatuses=OPEN,CONFIRMED&ps=500&p=2")"
          else
            page2='{"issues":[]}'
          fi

          issues="$(jq -n --argjson a "$page1" --argjson b "$page2" '{total: ($a.paging.total // $a.total), issues: ($a.issues + $b.issues)}')"
          echo "$issues" | jq '{
            total,
            returned: (.issues | length),
            creationDateCounts: ([.issues[].creationDate[0:10]] | group_by(.) | map({date: .[0], count: length})),
            updateDateCounts: ([.issues[].updateDate[0:10]] | group_by(.) | map({date: .[0], count: length})),
            earliestCreation: ([.issues[].creationDate] | min),
            latestCreation: ([.issues[].creationDate] | max),
            topRules: ([.issues[].rule] | group_by(.) | map({rule: .[0], count: length}) | sort_by(-.count) | .[:15]),
            topComponents: ([.issues[].component] | group_by(.) | map({component: .[0], count: length}) | sort_by(-.count) | .[:15])
          }'

          echo '=== Sample oldest and newest New Code issues ==='
          echo "$issues" | jq '{
            oldest: ([.issues[] | {key, rule, component, line, creationDate, updateDate, message}] | sort_by(.creationDate) | .[:5]),
            newest: ([.issues[] | {key, rule, component, line, creationDate, updateDate, message}] | sort_by(.creationDate) | reverse | .[:5])
          }'

          echo '=== All open/confirmed issue count for comparison ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&issueStatuses=OPEN,CONFIRMED&ps=1" \
            | jq '{allOpenConfirmed: (.paging.total // .total)}'
