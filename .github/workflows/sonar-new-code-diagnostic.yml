name: Sonar New Code Diagnostic

on:
  push:
    branches:
      - chore/sonar-new-code-diagnostic

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect effective Sonar new-code measures
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${SONAR_TOKEN}"
          sonar="https://sonarcloud.io"

          echo '=== Persisted definition ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/settings/values?component=${SONAR_PROJECT}&keys=sonar.leak.period,sonar.leak.period.type" \
            | jq '{settings: [.settings[] | {key, value, inherited}]}'

          echo '=== Effective project measures and period metadata ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/measures/component?component=${SONAR_PROJECT}&branch=main&metricKeys=ncloc,new_ncloc,new_lines,new_violations,violations,new_code_smells,code_smells,new_bugs,bugs,new_vulnerabilities,vulnerabilities,new_coverage,new_duplicated_lines_density" \
            | jq '{period, component: {key: .component.key, measures: [.component.measures[] | {metric, value, period, periods}]}}'

          echo '=== Component metadata ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/components/show?component=${SONAR_PROJECT}&branch=main" \
            | jq '{component: {key: .component.key, analysisDate: .component.analysisDate, leakPeriodDate: .component.leakPeriodDate, version: .component.version}}'

          echo '=== Latest analysis ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/project_analyses/search?project=${SONAR_PROJECT}&branch=main&ps=1" \
            | jq '{analysis: (.analyses[0] | {key, date, projectVersion, revision, manualNewCodePeriodBaseline, events})}'

          echo '=== New vs overall issues ==='
          new_total="$(curl --silent --show-error --fail --location --header "$auth" "$sonar/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&inNewCodePeriod=true&issueStatuses=OPEN,CONFIRMED&ps=1" | jq -r '.paging.total // .total')"
          all_total="$(curl --silent --show-error --fail --location --header "$auth" "$sonar/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&issueStatuses=OPEN,CONFIRMED&ps=1" | jq -r '.paging.total // .total')"
          jq -n --argjson new "$new_total" --argjson all "$all_total" '{newOpenConfirmed: $new, allOpenConfirmed: $all}'
