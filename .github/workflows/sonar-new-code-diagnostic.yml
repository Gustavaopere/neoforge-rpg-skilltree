name: Sonar New Code Diagnostic

on:
  push:
    branches:
      - chore/sonar-new-code-diagnostic

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set and verify Sonar new-code baseline
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
          SONAR_BASELINE_ANALYSIS: fc9c68e8-fcd8-4c0a-a94a-27e20ed07757
        shell: bash
        run: |
          set -euo pipefail

          sonar_get() {
            local path="$1"
            local out="$2"
            local code
            code=$(curl --silent --show-error --location \
              --output "$out" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              "https://sonarcloud.io${path}")
            if [[ "$code" != "200" ]]; then
              code=$(curl --silent --show-error --location \
                --output "$out" --write-out '%{http_code}' \
                --user "${SONAR_TOKEN}:" \
                "https://sonarcloud.io${path}")
            fi
            printf '%s' "$code"
          }

          sonar_post_baseline() {
            local out="$1"
            local code
            code=$(curl --silent --show-error --location \
              --output "$out" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --data-urlencode "analysis=${SONAR_BASELINE_ANALYSIS}" \
              --data-urlencode "project=${SONAR_PROJECT}" \
              --data-urlencode "branch=main" \
              "https://sonarcloud.io/api/project_analyses/set_baseline")
            if [[ "$code" != "200" && "$code" != "204" ]]; then
              code=$(curl --silent --show-error --location \
                --output "$out" --write-out '%{http_code}' \
                --request POST \
                --user "${SONAR_TOKEN}:" \
                --data-urlencode "analysis=${SONAR_BASELINE_ANALYSIS}" \
                --data-urlencode "project=${SONAR_PROJECT}" \
                --data-urlencode "branch=main" \
                "https://sonarcloud.io/api/project_analyses/set_baseline")
            fi
            printf '%s' "$code"
          }

          echo '=== Set baseline ==='
          code=$(sonar_post_baseline /tmp/set-baseline.json)
          echo "HTTP ${code}"
          if [[ "$code" != "200" && "$code" != "204" ]]; then
            jq '{errors}' /tmp/set-baseline.json 2>/dev/null || cat /tmp/set-baseline.json
            exit 1
          fi

          echo '=== Verify new issues after baseline ==='
          code=$(sonar_get "/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&inNewCodePeriod=true&ps=3" /tmp/issues.json)
          echo "HTTP ${code}"
          if [[ "$code" != "200" ]]; then
            jq '{errors}' /tmp/issues.json 2>/dev/null || cat /tmp/issues.json
            exit 1
          fi
          jq '{total: (.paging.total // .total), issues: [.issues[] | {key, rule, component, line, status, creationDate}]}' /tmp/issues.json
