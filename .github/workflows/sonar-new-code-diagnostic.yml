name: Sonar New Code Diagnostic

on:
  push:
    branches:
      - chore/sonar-new-code-diagnostic

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SonarCloud fixed onboarding date and verify
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
          GH_TOKEN: ${{ github.token }}
          ONBOARDING_SHA: 66fcec7b163320cfb0d79943969aae33f3adf862
          NEW_CODE_DATE: '2026-09-01'
        shell: bash
        run: |
          set -euo pipefail

          sonar_auth="Authorization: Bearer ${SONAR_TOKEN}"
          gh_auth="Authorization: Bearer ${GH_TOKEN}"
          sonar="https://sonarcloud.io"

          echo '=== Resolve current main and guard onboarding ancestry ==='
          current_main="$({
            curl --silent --show-error --fail --location \
              --header "$gh_auth" \
              --header 'Accept: application/vnd.github+json' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          } | jq -r '.object.sha')"
          echo "currentMainSha=${current_main}"

          comparison="$({
            curl --silent --show-error --fail --location \
              --header "$gh_auth" \
              --header 'Accept: application/vnd.github+json' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/compare/${ONBOARDING_SHA}...${current_main}"
          })"
          echo "$comparison" | jq '{status, ahead_by, behind_by, mergeBase: .merge_base_commit.sha}'
          test "$(echo "$comparison" | jq -r '.merge_base_commit.sha')" = "$ONBOARDING_SHA"
          test "$(echo "$comparison" | jq -r '.behind_by')" = '0'
          case "$(echo "$comparison" | jq -r '.status')" in
            identical|ahead) ;;
            *) echo 'Current main is not a descendant of the onboarding SHA.' >&2; exit 1 ;;
          esac

          echo '=== Remove legacy manual analysis baseline from main ==='
          curl --silent --show-error --fail --location \
            --request POST \
            --header "$sonar_auth" \
            --data-urlencode "project=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main' \
            "$sonar/api/project_analyses/unset_baseline"

          echo '=== Configure Cloud-supported specific date ==='
          curl --silent --show-error --fail --location \
            --request POST \
            --header "$sonar_auth" \
            --data-urlencode "component=${SONAR_PROJECT}" \
            --data-urlencode 'key=sonar.leak.period' \
            --data-urlencode "value=${NEW_CODE_DATE}" \
            "$sonar/api/settings/set"

          curl --silent --show-error --fail --location \
            --request POST \
            --header "$sonar_auth" \
            --data-urlencode "component=${SONAR_PROJECT}" \
            --data-urlencode 'key=sonar.leak.period.type' \
            --data-urlencode 'value=date' \
            "$sonar/api/settings/set"

          echo '=== Verify effective project settings ==='
          settings="$({
            curl --silent --show-error --fail --location \
              --header "$sonar_auth" \
              "$sonar/api/settings/values?component=${SONAR_PROJECT}&keys=sonar.leak.period,sonar.leak.period.type"
          })"
          echo "$settings" | jq '{settings: [.settings[] | {key, value, inherited}]}'
          period="$(echo "$settings" | jq -r '.settings[] | select(.key == "sonar.leak.period") | .value')"
          period_type="$(echo "$settings" | jq -r '.settings[] | select(.key == "sonar.leak.period.type") | .value')"
          test "$period" = "$NEW_CODE_DATE"
          test "$period_type" = 'date'

          echo '=== Verify legacy manual baseline is unset ==='
          analyses="$({
            curl --silent --show-error --fail --location \
              --header "$sonar_auth" \
              "$sonar/api/project_analyses/search?project=${SONAR_PROJECT}&branch=main&ps=10"
          })"
          echo "$analyses" | jq '{analyses: [.analyses[] | {key, date, projectVersion, revision, manualNewCodePeriodBaseline}]}'
          test "$(echo "$analyses" | jq '[.analyses[] | select(.manualNewCodePeriodBaseline == true)] | length')" = '0'

          echo '=== Dispatch fresh main Sonar analysis ==='
          curl --silent --show-error --fail --location \
            --request POST \
            --header "$gh_auth" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main"}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/sonarqube.yml/dispatches"
