name: Sonar New Code Diagnostic

on:
  push:
    branches:
      - chore/sonar-new-code-diagnostic

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-anchor main Sonar baseline and verify
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 66fcec7b163320cfb0d79943969aae33f3adf862
        shell: bash
        run: |
          set -euo pipefail

          sonar_auth="Authorization: Bearer ${SONAR_TOKEN}"
          gh_auth="Authorization: Bearer ${GH_TOKEN}"
          sonar="https://sonarcloud.io"

          echo '=== Guard current main SHA ==='
          current_main="$({
            curl --silent --show-error --fail --location \
              --header "$gh_auth" \
              --header 'Accept: application/vnd.github+json' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          } | jq -r '.object.sha')"
          echo "currentMainSha=${current_main}"
          test "$current_main" = "$EXPECTED_MAIN_SHA"

          echo '=== Resolve latest main Sonar analysis ==='
          analyses="$({
            curl --silent --show-error --fail --location \
              --header "$sonar_auth" \
              "$sonar/api/project_analyses/search?project=${SONAR_PROJECT}&branch=main&ps=5"
          })"
          echo "$analyses" | jq '{analyses: [.analyses[] | {key, date, projectVersion, revision, manualNewCodePeriodBaseline}]}'

          baseline_key="$(echo "$analyses" | jq -r '.analyses[0].key')"
          baseline_revision="$(echo "$analyses" | jq -r '.analyses[0].revision // empty')"
          echo "baselineAnalysis=${baseline_key}"
          echo "baselineRevision=${baseline_revision}"
          test -n "$baseline_key"
          test "$baseline_revision" = "$EXPECTED_MAIN_SHA"

          echo '=== Set explicit manual baseline for main ==='
          curl --silent --show-error --fail --location \
            --request POST \
            --header "$sonar_auth" \
            --data-urlencode "project=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main' \
            --data-urlencode "analysis=${baseline_key}" \
            "$sonar/api/project_analyses/set_baseline"

          echo '=== Verify manual baseline flag ==='
          after="$({
            curl --silent --show-error --fail --location \
              --header "$sonar_auth" \
              "$sonar/api/project_analyses/search?project=${SONAR_PROJECT}&branch=main&ps=5"
          })"
          echo "$after" | jq '{analyses: [.analyses[] | {key, date, projectVersion, revision, manualNewCodePeriodBaseline}]}'
          selected="$(echo "$after" | jq -r --arg key "$baseline_key" '.analyses[] | select(.key == $key) | .manualNewCodePeriodBaseline')"
          echo "manualNewCodePeriodBaseline=${selected}"
          test "$selected" = 'true'

          echo '=== New issues immediately after baseline ==='
          curl --silent --show-error --fail --location \
            --header "$sonar_auth" \
            "$sonar/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&inNewCodePeriod=true&ps=1" \
            | jq '{currentNewIssues: (.paging.total // .total)}'

          echo '=== Dispatch a fresh main Sonar analysis ==='
          curl --silent --show-error --fail --location \
            --request POST \
            --header "$gh_auth" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main"}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/sonarqube.yml/dispatches"
