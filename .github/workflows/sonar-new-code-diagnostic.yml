name: Sonar New Code Diagnostic

on:
  push:
    branches:
      - chore/sonar-new-code-diagnostic

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Sonar issue filters and quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${SONAR_TOKEN}"
          sonar="https://sonarcloud.io"

          echo '=== SonarCloud api/issues/search parameter surface ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/webservices/list" \
            | jq '{issuesSearch: ([.webServices[] | select(.path == "api/issues") | .actions[] | select(.key == "search") | {key, post, params: [.params[] | {key, required, possibleValues}]}][0])}'

          echo '=== Quality Gate project status ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/qualitygates/project_status?projectKey=${SONAR_PROJECT}&branch=main" \
            | jq '{projectStatus: {status: .projectStatus.status, conditions: [.projectStatus.conditions[] | {status, metricKey, comparator, errorThreshold, actualValue}], periods: .projectStatus.periods, ignoredConditions: .projectStatus.ignoredConditions, caycStatus: .projectStatus.caycStatus}}'

          echo '=== Current measures authoritative new/overall ==='
          curl --silent --show-error --fail --location \
            --header "$auth" \
            "$sonar/api/measures/component?component=${SONAR_PROJECT}&branch=main&metricKeys=new_violations,violations,new_code_smells,code_smells,new_bugs,bugs,new_vulnerabilities,vulnerabilities,new_lines,new_ncloc" \
            | jq '{measures: [.component.measures[] | {metric, value, periods}]}'

          echo '=== Compare issue query parameters ==='
          all="$(curl --silent --show-error --fail --location --header "$auth" "$sonar/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&issueStatuses=OPEN,CONFIRMED&ps=1" | jq -r '.paging.total // .total')"
          current="$(curl --silent --show-error --fail --location --header "$auth" "$sonar/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&inNewCodePeriod=true&issueStatuses=OPEN,CONFIRMED&ps=1" | jq -r '.paging.total // .total')"
          legacy="$(curl --silent --show-error --fail --location --header "$auth" "$sonar/api/issues/search?componentKeys=${SONAR_PROJECT}&branch=main&sinceLeakPeriod=true&issueStatuses=OPEN,CONFIRMED&ps=1" | jq -r '.paging.total // .total')"
          jq -n --argjson all "$all" --argjson current "$current" --argjson legacy "$legacy" '{overall: $all, inNewCodePeriod: $current, sinceLeakPeriod: $legacy}'
