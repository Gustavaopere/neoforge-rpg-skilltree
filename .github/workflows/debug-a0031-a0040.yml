name: DEBUG A0031-A0040 NeoForge JUnit

on:
  push:
    branches:
      - feat/chat2-a0031-a0040-retro-implementation

permissions:
  contents: read

jobs:
  debug-test-junit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run A0031-A0040 adapter with full diagnostics
        run: ./gradlew --no-daemon testJunit --info --stacktrace
