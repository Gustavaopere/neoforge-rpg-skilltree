name: Compendium Editorial CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/compendium/**'
      - 'src/main/resources/data/rpgskilltree/compendium/editorial/**'
      - 'src/main/resources/assets/rpgskilltree/lang/pt_br.json'
      - 'src/main/resources/assets/rpgskilltree/lang/en_us.json'
      - 'src/main/java/dev/gustavopere/rpgskilltree/RpgSkillTreeMod.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/compendium/editorial/**'
      - 'src/main/java/dev/gustavopere/rpgskilltree/compendium/client/CompendiumPageModel.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/compendium/client/CompendiumPageModelFactory.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/compendium/client/CompendiumEditorialDisplayModel.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/runtime/compendium/CompendiumEditorial*.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/runtime/compendium/RuntimeCompendiumEditorialCatalog.java'
      - 'src/main/java/dev/gustavopere/rpgskilltree/runtime/client/CompendiumScreen.java'
      - 'src/test/java/dev/gustavopere/rpgskilltree/compendium/editorial/**'
      - 'src/test/java/dev/gustavopere/rpgskilltree/compendium/client/CompendiumPageModelFactoryTest.java'
      - 'src/test/java/dev/gustavopere/rpgskilltree/compendium/client/CompendiumEditorialDisplayModelTest.java'
      - 'src/test/java/dev/gustavopere/rpgskilltree/runtime/compendium/CompendiumEditorial*.java'
      - 'src/test/java/dev/gustavopere/rpgskilltree/runtime/compendium/RuntimeCompendiumEditorialCatalogJUnitTest.java'
      - 'plans/10-compendio-natural/10-ptbr-corpus-editorial.md'
      - '.github/workflows/compendium-editorial-ci.yml'

permissions:
  contents: read

jobs:
  editorial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Editorial corpus schema and coverage tests
        run: python3 scripts/compendium/test_editorial_corpus.py

      - name: Editorial model and locale contracts
        run: bash scripts/compendium/test_model_catalog.sh

      - name: Editorial runtime JUnit
        run: ./gradlew --no-daemon test --tests '*Editorial*'
