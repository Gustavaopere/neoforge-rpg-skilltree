name: Compendium Editorial CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/compendium/**'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'plans/10-compendio-natural/10-ptbr-corpus-editorial.md'
      - '.github/workflows/compendium-editorial-ci.yml'

permissions:
  contents: read

jobs:
  editorial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Editorial corpus schema and coverage tests
        run: python3 scripts/compendium/test_editorial_corpus.py

      - name: PT-BR localization completeness tests
        run: python3 scripts/compendium/test_ptbr_localization.py

      - name: Editorial model and locale contracts
        run: bash scripts/compendium/test_model_catalog.sh

      - name: Editorial runtime JUnit
        run: ./gradlew --no-daemon test --tests '*Editorial*'
