name: Mod Engineering I3 Mod Scaffolder

on:
  push:
    branches:
      - feat/mod-engineering-i3-mod-scaffolder
  pull_request:
    paths:
      - 'PROJECT-INSTRUCTIONS/engineering/templates/neoforge-mod/**'
      - 'PROJECT-INSTRUCTIONS/engineering/tooling/scaffolder/**'
      - 'PROJECT-INSTRUCTIONS/engineering/tests/test_i3_mod_scaffolder.py'
      - 'PROJECT-INSTRUCTIONS/engineering/tests/fixtures/i3-*.json'
      - 'PROJECT-INSTRUCTIONS/engineering/tests/golden/i3-golden-mod/**'
      - '.github/workflows/mod-engineering-i3-mod-scaffolder.yml'

permissions:
  contents: read

jobs:
  scaffolder-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Run I3 scaffolder contract tests
        run: python3 -m unittest PROJECT-INSTRUCTIONS/engineering/tests/test_i3_mod_scaffolder.py
      - name: Generate project from canonical fixtures
        run: >-
          python3 PROJECT-INSTRUCTIONS/engineering/tooling/scaffolder/scaffold_mod.py
          --mod-spec PROJECT-INSTRUCTIONS/engineering/tests/fixtures/i3-golden-mod-spec.json
          --config PROJECT-INSTRUCTIONS/engineering/tests/fixtures/i3-golden-scaffold-config.json
          --output "$RUNNER_TEMP/i3-generated"
      - name: Build generated NeoForge project
        run: |
          chmod +x "$RUNNER_TEMP/i3-generated/gradlew"
          cd "$RUNNER_TEMP/i3-generated"
          GRADLE_USER_HOME="$RUNNER_TEMP/i3-gradle-home" ./gradlew test build --no-daemon