name: Import Volcanoes standalone Git history

on:
  push:
    branches:
      - archive/preserve-volcanoes-standalone-history
    paths:
      - .github/workflows/import-volcanoes-standalone-history.yml

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RPG repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download immutable standalone export
        shell: bash
        run: |
          set -euo pipefail
          export_commit='97009d4c9a7e1c53b3680e845e8fb47d76643a87'
          base="https://raw.githubusercontent.com/Gustavaopere/Volcanoes/${export_commit}/history-export"
          tmp="${RUNNER_TEMP}/volcanoes-history-import"
          mkdir -p "$tmp"
          curl --fail --location --silent --show-error "${base}/METADATA.txt" -o "$tmp/METADATA.txt"
          curl --fail --location --silent --show-error "${base}/SHA256SUMS" -o "$tmp/SHA256SUMS.source"
          for part in 0000 0001 0002 0003 0004; do
            curl --fail --location --silent --show-error \
              "${base}/Volcanoes-full-history.bundle.b64.part-${part}" \
              -o "$tmp/Volcanoes-full-history.bundle.b64.part-${part}"
          done

      - name: Reconstruct and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/volcanoes-history-import"
          archive='docs/archive/volcanoes/standalone-git-history'
          mkdir -p "$archive"
          cat "$tmp"/Volcanoes-full-history.bundle.b64.part-* | base64 --decode > "$archive/Volcanoes-full-history.bundle"
          expected="$(awk '{print $1}' "$tmp/SHA256SUMS.source")"
          actual="$(sha256sum "$archive/Volcanoes-full-history.bundle" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" 'Volcanoes-full-history.bundle' > "$archive/SHA256SUMS"
          cp "$tmp/METADATA.txt" "$archive/STANDALONE_EXPORT_METADATA.txt"
          git bundle verify "$archive/Volcanoes-full-history.bundle" 2>&1 | tee "$archive/BUNDLE_VERIFY.txt"
          git bundle list-heads "$archive/Volcanoes-full-history.bundle" > "$archive/BUNDLE_HEADS.txt"

      - name: Prove historical source is restorable
        shell: bash
        run: |
          set -euo pipefail
          archive='docs/archive/volcanoes/standalone-git-history'
          restore="${RUNNER_TEMP}/Volcanoes-restored"
          git clone --branch main "$archive/Volcanoes-full-history.bundle" "$restore"
          test "$(git -C "$restore" rev-parse HEAD)" = '298352973e941c2034c97465929dc67f6a0400e2'
          git -C "$restore" cat-file -e 'eaddc3232dfc600780769f4a5e7e45ff1e50181c^{commit}'
          git -C "$restore" cat-file -e '298352973e941c2034c97465929dc67f6a0400e2^{commit}'
          git -C "$restore" show --quiet --format='%H %s' eaddc3232dfc600780769f4a5e7e45ff1e50181c | tee "$archive/HISTORICAL_SOURCE_CHECKPOINT.txt"

      - name: Write recovery documentation
        shell: bash
        run: |
          set -euo pipefail
          archive='docs/archive/volcanoes/standalone-git-history'
          cat > "$archive/README.md" <<'EOF'
          # Volcanoes standalone — complete Git history archive

          This directory preserves the complete Git history exported from the retired `Gustavaopere/Volcanoes` repository before that repository is deleted.

          ## Authority

          The live implementation is **not** this bundle. Runtime authority remains `Gustavaopere/neoforge-rpg-skilltree`.

          The bundle exists only for provenance, historical investigation, and disaster recovery.

          ## Preserved checkpoints

          - standalone tombstone `main`: `298352973e941c2034c97465929dc67f6a0400e2`
          - last complete standalone source checkpoint: `eaddc3232dfc600780769f4a5e7e45ff1e50181c`
          - immutable export commit used to build this archive: `97009d4c9a7e1c53b3680e845e8fb47d76643a87`
          - bundle SHA-256: see `SHA256SUMS`

          ## Restore the retired repository locally

          From this directory:

          ```bash
          sha256sum -c SHA256SUMS
          git bundle verify Volcanoes-full-history.bundle
          git clone --branch main Volcanoes-full-history.bundle Volcanoes-restored
          cd Volcanoes-restored
          git cat-file -e eaddc3232dfc600780769f4a5e7e45ff1e50181c^{commit}
          ```

          `BUNDLE_HEADS.txt` records exported branch/tag heads, while `STANDALONE_EXPORT_METADATA.txt` records the source refs and bundle size captured during export.

          Do not restart independent development from this archive. Any future Volcanoes change belongs in the unified RPG repository.
          EOF

      - name: Commit verified archive and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-volcanoes-standalone-history.yml
          git add docs/archive/volcanoes/standalone-git-history
          git commit -m 'archive(volcanoes): preserve complete standalone Git history'
          git push origin HEAD:archive/preserve-volcanoes-standalone-history
