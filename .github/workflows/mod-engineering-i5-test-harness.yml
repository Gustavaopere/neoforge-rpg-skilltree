name: Mod Engineering I5 Test Harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run I5 test harness contract tests
        run: python3 -m unittest PROJECT-INSTRUCTIONS/engineering/tests/test_i5_test_harness.py
