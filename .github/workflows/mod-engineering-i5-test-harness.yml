name: Mod Engineering I5 Test Harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run I5 test harness contract tests
        run: python3 -m unittest PROJECT-INSTRUCTIONS/engineering/tests/test_i5_test_harness.py

  green-pr4-texture-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/blockbench-pr4-texture-acceptance'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/blockbench-pr4-texture-acceptance
          fetch-depth: 0

      - name: Apply minimal read-only texture compare patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/blockbench-plugin/uv_texture_adapter.js')
          text = path.read_text()

          marker = "  function requireEditableTexture(texture) {\n"
          if text.count(marker) != 1:
              raise SystemExit('requireEditableTexture marker is not unique')
          readable = """  function requireComparableTexture(texture) {
    if (texture.layers_enabled === true) {
      fail('LAYERED_TEXTURE_UNSUPPORTED', `Texture \"${texture.uuid || texture.id}\" uses layers; PR4 requires an explicit future layer target.`);
    }
    const ctx = texture.ctx;
    if (!texture.canvas || !ctx || typeof ctx.getImageData !== 'function') {
      fail('BLOCKBENCH_API_UNAVAILABLE', `Texture \"${texture.uuid || texture.id}\" does not expose a readable 2D canvas.`);
    }
    if (!Number.isSafeInteger(texture.width) || texture.width < 1 || !Number.isSafeInteger(texture.height) || texture.height < 1) {
      fail('INVALID_TEXTURE_DIMENSIONS', `Texture \"${texture.uuid || texture.id}\" has invalid dimensions.`);
    }
    return texture;
  }

"""
          text = text.replace(marker, readable + marker, 1)

          marker = "  function normalizedTextureRef(value) {\n"
          if text.count(marker) != 1:
              raise SystemExit('normalizedTextureRef marker is not unique')
          compare = """  function compareTextures(input) {
    if (!input || typeof input !== 'object' || Array.isArray(input)) {
      fail('INVALID_TEXTURE_COMPARE', 'Texture compare request must be an object.');
    }
    for (const key of Object.keys(input)) {
      if (key !== 'leftTextureId' && key !== 'rightTextureId') {
        fail('INVALID_TEXTURE_COMPARE', `Texture compare request contains unsupported field \"${key}\".`);
      }
    }
    const leftTextureId = typeof input.leftTextureId === 'string' ? input.leftTextureId.trim() : '';
    const rightTextureId = typeof input.rightTextureId === 'string' ? input.rightTextureId.trim() : '';
    if (!leftTextureId || !rightTextureId) {
      fail('INVALID_TEXTURE_ID', 'Texture compare requires non-empty leftTextureId and rightTextureId.');
    }

    const left = requireComparableTexture(requireTexture(leftTextureId));
    const right = requireComparableTexture(requireTexture(rightTextureId));
    const leftDimensions = Object.freeze({width: left.width, height: left.height});
    const rightDimensions = Object.freeze({width: right.width, height: right.height});
    const dimensionsEqual = left.width === right.width && left.height === right.height;
    const projectRevision = getRevision();

    if (!dimensionsEqual) {
      return Object.freeze({
        ok: true,
        projectRevision,
        leftTextureId,
        rightTextureId,
        leftDimensions,
        rightDimensions,
        dimensionsEqual: false,
        equal: false,
        comparedPixels: 0,
        changedPixels: null,
        changedBounds: null,
      });
    }

    const comparedPixels = left.width * left.height;
    if (!Number.isSafeInteger(comparedPixels) || comparedPixels > MAX_TEXTURE_PIXELS_PER_BATCH) {
      fail('TEXTURE_PIXEL_BUDGET_EXCEEDED', `Texture compare may read ${comparedPixels} pixels; maximum is ${MAX_TEXTURE_PIXELS_PER_BATCH}.`);
    }
    const leftImage = left.ctx.getImageData(0, 0, left.width, left.height);
    const rightImage = right.ctx.getImageData(0, 0, right.width, right.height);
    const expectedBytes = comparedPixels * 4;
    if (!leftImage?.data || leftImage.data.length !== expectedBytes || !rightImage?.data || rightImage.data.length !== expectedBytes) {
      fail('BLOCKBENCH_API_UNAVAILABLE', 'Texture compare did not receive the expected RGBA bitmap data.');
    }

    let changedPixels = 0;
    let minX = left.width;
    let minY = left.height;
    let maxX = -1;
    let maxY = -1;
    for (let pixelIndex = 0; pixelIndex < comparedPixels; pixelIndex += 1) {
      const offset = pixelIndex * 4;
      let changed = false;
      for (let channel = 0; channel < 4; channel += 1) {
        if (leftImage.data[offset + channel] !== rightImage.data[offset + channel]) {
          changed = true;
          break;
        }
      }
      if (!changed) continue;
      changedPixels += 1;
      const x = pixelIndex % left.width;
      const y = Math.floor(pixelIndex / left.width);
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x > maxX) maxX = x;
      if (y > maxY) maxY = y;
    }
    const changedBounds = changedPixels === 0 ? null : Object.freeze({
      x: minX,
      y: minY,
      width: maxX - minX + 1,
      height: maxY - minY + 1,
    });

    return Object.freeze({
      ok: true,
      projectRevision,
      leftTextureId,
      rightTextureId,
      leftDimensions,
      rightDimensions,
      dimensionsEqual: true,
      equal: changedPixels === 0,
      comparedPixels,
      changedPixels,
      changedBounds,
    });
  }

"""
          text = text.replace(marker, compare + marker, 1)

          marker = "  return Object.freeze({\n    getRevision,\n    samplePalette,\n"
          if text.count(marker) != 1:
              raise SystemExit('adapter export marker is not unique')
          text = text.replace(marker, "  return Object.freeze({\n    getRevision,\n    compareTextures,\n    samplePalette,\n", 1)
          path.write_text(text)
          PY

      - name: Run targeted PR4 texture acceptance
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit
        run: node --test rpg_asset_toolkit.texture_acceptance.test.js

      - name: Regenerate standalone bundle
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit
        run: node build_toolkit_bundle.js

      - name: Verify deterministic standalone bundle
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit
        run: node build_toolkit_bundle.js --check

      - name: Run aggregate toolkit regression
        working-directory: PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit
        run: node --test rpg_asset_toolkit.test.js

      - name: Verify repository validator
        run: python3 PROJECT-INSTRUCTIONS/skills/scripts/validate_skill_repository.py

      - name: Commit tested production and restore workflow state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/mod-engineering-i5-test-harness.yml
          git rm .github/workflows/tmp-pr4-texture-acceptance-green.yml
          git rm .github/tmp-pr4-texture-acceptance-trigger.txt
          git add .github/workflows/mod-engineering-i5-test-harness.yml
          git add PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/blockbench-plugin/uv_texture_adapter.js
          git add PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.js
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = sorted([
              '.github/tmp-pr4-texture-acceptance-trigger.txt',
              '.github/workflows/mod-engineering-i5-test-harness.yml',
              '.github/workflows/tmp-pr4-texture-acceptance-green.yml',
              'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/blockbench-plugin/uv_texture_adapter.js',
              'PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.js',
          ])
          actual = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged paths: {actual!r}')
          PY
          git commit -m 'feat(blockbench): add deterministic texture compare'
          git push origin HEAD:feat/blockbench-pr4-texture-acceptance
