name: Blacksmith 16B Smoke Diagnostic

on:
  pull_request:
    branches:
      - main

concurrency:
  group: blacksmith-16b-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper contract
        run: python3 scripts/verify-gradle-wrapper.py

      - name: Reproduce dedicated-server startup
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/server build
          printf 'eula=true\n' > runs/server/eula.txt
          LOG="$PWD/build/server-smoke.log"
          export RPGSKILLTREE_COMPENDIUM_INVENTORY=1
          set +e
          timeout 180s ./gradlew --no-daemon runServer >"$LOG" 2>&1
          STATUS=$?
          set -e
          if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG"; then
            echo 'Dedicated server reached ready state.'
            exit 0
          fi
          echo "Dedicated server did not reach ready state (status=$STATUS)."
          echo '--- focused diagnostics ---'
          grep -nE 'Exception|Caused by:|ERROR|FATAL|Failed|failure|rpgskilltree|productivemetalworks|exact_mod_version|CONDITION_CODECS' "$LOG" | tail -n 160 || true
          echo '--- final log tail ---'
          tail -n 240 "$LOG" || true
          exit 1

      - name: Upload dedicated smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blacksmith-16b-server-smoke-${{ github.sha }}
          path: build/server-smoke.log
          if-no-files-found: error
          retention-days: 3
