name: SonarQube Cloud

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --no-daemon build sonar --info

      - name: Diagnostic - print PR new-code coverage by file
        shell: bash
        run: |
          set -euo pipefail
          ce_task_url=$(grep '^ceTaskUrl=' build/sonar/report-task.txt | cut -d= -f2-)
          for attempt in {1..30}; do
            status=$(curl --fail --silent --show-error "$ce_task_url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["task"]["status"])')
            echo "Sonar CE status: $status"
            if [ "$status" = SUCCESS ]; then
              break
            fi
            if [ "$status" = FAILED ] || [ "$status" = CANCELED ]; then
              exit 1
            fi
            sleep 2
          done
          url='https://sonarcloud.io/api/measures/component_tree?component=Gustavaopere_neoforge-rpg-skilltree&pullRequest=252&metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines&qualifiers=FIL&p=1&ps=100'
          curl --fail --silent --show-error "$url" -o /tmp/sonar-coverage.json
          python3 - <<'PY'
          import json
          with open('/tmp/sonar-coverage.json', encoding='utf-8') as f:
              data = json.load(f)
          print('SONAR_COVERAGE_COMPONENTS', len(data.get('components', [])))
          for component in data.get('components', []):
              path = component.get('path') or component.get('name') or component.get('key')
              measures = {m['metric']: m.get('value', '') for m in component.get('measures', [])}
              if any(measures.values()):
                  print(f"SONAR_COVERAGE_FILE path={path} new_coverage={measures.get('new_coverage','')} new_lines_to_cover={measures.get('new_lines_to_cover','')} new_uncovered_lines={measures.get('new_uncovered_lines','')}")
          PY
