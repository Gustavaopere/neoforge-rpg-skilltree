name: SonarQube Cloud

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Sonar workflow policy test
        run: python3 scripts/test_sonar_workflow_policy.py

      - name: Sonar New Code period self-healing regression test
        run: python3 scripts/test_sonar_new_code_period_policy.py

      - name: Ensure Sonar New Code period is Previous version
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/ensure_sonar_new_code_period.py

      - name: Volcanoes NBT tag constant regression test
        run: python3 scripts/test_volcanoes_nbt_tag_constant_access.py

      - name: Sonar New Code hotspot regression test
        run: python3 scripts/test_sonar_new_code_hotspots.py

      - name: Collect provider-free GameTest coverage
        run: >-
          ./gradlew --no-daemon
          -I gradle/sonar-gametest-coverage.init.gradle
          runGameTestServer
          -PgameTestCoverageName=provider-free

      - name: Collect Battle Mage provider GameTest coverage
        run: >-
          ./gradlew --no-daemon
          -I gradle/sonar-gametest-coverage.init.gradle
          runGameTestServer
          -PbattleMageProviderRuntime=true
          -PgameTestCoverageName=battle-mage-provider

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./gradlew --no-daemon
          -I gradle/sonar-gametest-coverage.init.gradle
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml,build/reports/jacoco/provider-free/provider-free.xml,build/reports/jacoco/battle-mage-provider/battle-mage-provider.xml
          -Dsonar.tests=src/test/java,src/main/java
          -Dsonar.test.inclusions=src/test/java/**/*,src/main/java/dev/gustavopere/rpgskilltree/gametest/BattleMageProviderGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/battlemage/gametest/**/*,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/battlemage/BattleMageReloadAndAuthorityGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/economy/ColonyEconomyPersistenceGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/economy/gametest/**/*
          -Dsonar.exclusions=src/main/java/dev/gustavopere/rpgskilltree/gametest/BattleMageProviderGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/battlemage/gametest/**/*,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/battlemage/BattleMageReloadAndAuthorityGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/economy/ColonyEconomyPersistenceGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/economy/gametest/**/*
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
          build sonar --info

      - name: Diagnose Sonar PR issues and new-code coverage
        if: always() && github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
          SONAR_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          issues_response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "componentKeys=${SONAR_PROJECT}" \
            --data-urlencode "pullRequest=${SONAR_PR}" \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=100' \
            'https://sonarcloud.io/api/issues/search')"

          echo '=== Sonar PR issues ==='
          jq -r '.issues[]? | "ISSUE|rule=\(.rule)|type=\(.type // "")|severity=\(.severity // "")|component=\(.component // "")|line=\(.line // 0)|message=\(.message // "")"' <<<"$issues_response"

          coverage_response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "component=${SONAR_PROJECT}" \
            --data-urlencode "pullRequest=${SONAR_PR}" \
            --data-urlencode 'metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines,new_conditions_to_cover,new_uncovered_conditions' \
            --data-urlencode 'qualifiers=FIL' \
            --data-urlencode 'ps=500' \
            'https://sonarcloud.io/api/measures/component_tree')"

          echo '=== Sonar files with uncovered new code ==='
          jq -r '
            .components[]?
            | {path: (.path // .name), measures: (.measures // [])}
            | . as $component
            | ($component.measures | map({key: .metric, value: (.period.value // .value // "0")}) | from_entries) as $m
            | select((($m.new_uncovered_lines // "0") | tonumber) > 0 or (($m.new_uncovered_conditions // "0") | tonumber) > 0)
            | "COVERAGE|path=\($component.path)|new_coverage=\($m.new_coverage // "")|new_lines_to_cover=\($m.new_lines_to_cover // "0")|new_uncovered_lines=\($m.new_uncovered_lines // "0")|new_conditions_to_cover=\($m.new_conditions_to_cover // "0")|new_uncovered_conditions=\($m.new_uncovered_conditions // "0")"
          ' <<<"$coverage_response" | sort

      - name: Verify Sonar new-code issue count on main
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "componentKeys=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main' \
            --data-urlencode 'sinceLeakPeriod=true' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=1' \
            'https://sonarcloud.io/api/issues/search')"

          new_issues="$(jq -r '.paging.total // .total' <<<"$response")"
          echo "Sonar open/confirmed issues on New Code: ${new_issues}"

          if [ "$new_issues" -ne 0 ]; then
            echo "Sonar New Code guard failed: ${new_issues} open/confirmed issue(s)." >&2
            exit 1
          fi
