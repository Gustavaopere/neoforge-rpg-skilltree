name: SonarQube Cloud

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Sonar workflow policy test
        run: python3 scripts/test_sonar_workflow_policy.py

      - name: Sonar New Code period self-healing regression test
        run: python3 scripts/test_sonar_new_code_period_policy.py

      - name: Ensure Sonar New Code period is Previous version
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/ensure_sonar_new_code_period.py

      - name: Volcanoes NBT tag constant regression test
        run: python3 scripts/test_volcanoes_nbt_tag_constant_access.py

      - name: Sonar New Code hotspot regression test
        run: python3 scripts/test_sonar_new_code_hotspots.py

      - name: Collect provider-free GameTest coverage
        run: >-
          ./gradlew --no-daemon
          -I gradle/sonar-gametest-coverage.init.gradle
          runGameTestServer
          -PgameTestCoverageName=provider-free

      - name: Collect Battle Mage provider GameTest coverage
        run: >-
          ./gradlew --no-daemon
          -I gradle/sonar-gametest-coverage.init.gradle
          runGameTestServer
          -PbattleMageProviderRuntime=true
          -PgameTestCoverageName=battle-mage-provider

      - name: Collect Ars Nouveau provider GameTest coverage
        run: >-
          ./gradlew --no-daemon
          -I gradle/sonar-gametest-coverage.init.gradle
          -I gradle/ars-provider-gametest-runtime.init.gradle
          runGameTestServer
          -ParsProviderRuntime=true
          -PgameTestCoverageName=ars-provider

      - name: Install exact Create provider runtime for coverage
        shell: bash
        run: |
          set -euo pipefail
          RUN="$PWD/runs/gameTestServer"
          MODS="$RUN/mods"
          META="$PWD/build/create-provider-coverage"
          mkdir -p "$MODS" "$META"
          rm -rf "$RUN/world"
          rm -f "$MODS"/*.jar
          printf 'eula=true\n' > "$RUN/eula.txt"

          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 \
            'https://maven.createmod.net/com/simibubi/create/create-1.21.1/6.0.10-280/create-1.21.1-6.0.10-280.jar' \
            --output "$MODS/create-1.21.1-6.0.10-280.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 \
            'https://maven.createmod.net/net/createmod/ponder/ponder-neoforge/1.0.82+mc1.21.1/ponder-neoforge-1.0.82+mc1.21.1.jar' \
            --output "$MODS/ponder-neoforge-1.0.82+mc1.21.1.jar"

          download_modrinth_version() {
            local version_id="$1"
            local expected_version="$2"
            local metadata="$META/$version_id.json"
            curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3 \
              "https://api.modrinth.com/v2/version/$version_id" -o "$metadata"
            test "$(jq -r '.version_number' "$metadata")" = "$expected_version"
            local url filename
            url="$(jq -r '[.files[] | select(.primary == true)] | if length == 1 then .[0].url else empty end' "$metadata")"
            filename="$(jq -r '[.files[] | select(.primary == true)] | if length == 1 then .[0].filename else empty end' "$metadata")"
            test -n "$url" && test -n "$filename"
            curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3 "$url" -o "$MODS/$filename"
          }

          download_modrinth_version U678xqle '2.0.5+mc1.21.1'
          download_modrinth_version 44pLdPGg '1.3.2+mc1.21.1'

          for mod in "$MODS"/*.jar; do
            jar tf "$mod" >/dev/null
          done

      - name: Collect Create provider GameTest coverage
        run: >-
          ./gradlew --no-daemon
          -I gradle/sonar-gametest-coverage.init.gradle
          runGameTestServer
          -PgameTestCoverageName=create-provider

      - name: Install audited MineColonies 1.1.1375 runtime stack for provider coverage
        shell: bash
        run: |
          set -euo pipefail
          MODS="$PWD/runs/gameTestServer/mods"
          mkdir -p "$MODS"
          rm -f "$MODS"/*.jar
          rm -rf runs/gameTestServer/world
          printf 'eula=true\n' > runs/gameTestServer/eula.txt

          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 \
            'https://www.cursemaven.com/curse/maven/minecolonies-245506/8765939/minecolonies-245506-8765939.jar' \
            --output "$MODS/minecolonies-1.1.1375-1.21.1-snapshot.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 \
            'https://www.cursemaven.com/curse/maven/structurize-298744/8610535/structurize-298744-8610535.jar' \
            --output "$MODS/structurize-1.0.832-1.21.1.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 \
            'https://ldtteam.jfrog.io/ldtteam/modding/com/ldtteam/multipiston/1.2.51-1.21.1-snapshot/multipiston-1.2.51-1.21.1-snapshot.jar' \
            --output "$MODS/multipiston-1.2.51-1.21.1-snapshot.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 \
            'https://www.cursemaven.com/curse/maven/blockui-522992/6367809/blockui-522992-6367809.jar' \
            --output "$MODS/blockui-1.0.199-1.21.1-snapshot.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 \
            'https://www.cursemaven.com/curse/maven/domum-ornamentum-527361/7231908/domum-ornamentum-527361-7231908.jar' \
            --output "$MODS/domum-ornamentum-1.0.223-snapshot.jar"

          for mod in "$MODS"/*.jar; do
            jar tf "$mod" >/dev/null
          done

      - name: Collect MineColonies provider GameTest coverage
        run: >-
          ./gradlew --no-daemon
          -I gradle/sonar-gametest-coverage.init.gradle
          runGameTestServer
          -PgameTestCoverageName=minecolonies-provider

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./gradlew --no-daemon --stacktrace
          -I gradle/sonar-gametest-coverage.init.gradle
          -Dsonar.projectVersion=${GITHUB_SHA}
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml,build/reports/jacoco/provider-free/provider-free.xml,build/reports/jacoco/battle-mage-provider/battle-mage-provider.xml,build/reports/jacoco/ars-provider/ars-provider.xml,build/reports/jacoco/create-provider/create-provider.xml,build/reports/jacoco/minecolonies-provider/minecolonies-provider.xml
          -Dsonar.tests=src/test/java,src/main/java
          -Dsonar.test.inclusions=src/test/java/**/*,src/main/java/dev/gustavopere/rpgskilltree/gametest/BattleMageProviderGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/ars/gametest/ArsProviderCausalityGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/ars/gametest/ArsIronsCoexistenceGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/battlemage/gametest/**/*,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/battlemage/BattleMageReloadAndAuthorityGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/economy/ColonyEconomyPersistenceGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/economy/gametest/**/*
          -Dsonar.exclusions=src/main/java/dev/gustavopere/rpgskilltree/gametest/BattleMageProviderGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/ars/gametest/ArsProviderCausalityGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/ars/gametest/ArsIronsCoexistenceGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/battlemage/gametest/**/*,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/battlemage/BattleMageReloadAndAuthorityGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/economy/ColonyEconomyPersistenceGameTests.java,src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/economy/gametest/**/*
          -Dsonar.issue.ignore.multicriteria=e1,e2,e3
          -Dsonar.issue.ignore.multicriteria.e1.ruleKey=java:S2187
          -Dsonar.issue.ignore.multicriteria.e1.resourceKey=src/main/java/dev/gustavopere/rpgskilltree/runtime/compat/minecolonies/economy/gametest/**/*
          -Dsonar.issue.ignore.multicriteria.e2.ruleKey=java:S2187
          -Dsonar.issue.ignore.multicriteria.e2.resourceKey=src/main/java/dev/gustavopere/rpgskilltree/runtime/economy/ColonyEconomyPersistenceGameTests.java
          -Dsonar.issue.ignore.multicriteria.e3.ruleKey=java:S1845
          -Dsonar.issue.ignore.multicriteria.e3.resourceKey=src/main/java/dev/gustavopere/rpgskilltree/runtime/economy/ColonyEconomySavedData.java
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
          build sonar --info

      - name: Diagnose Sonar pull-request new-code issues
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sonar-diagnostics

          response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "componentKeys=${SONAR_PROJECT}" \
            --data-urlencode "pullRequest=${SONAR_PULL_REQUEST}" \
            --data-urlencode 'sinceLeakPeriod=true' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=100' \
            'https://sonarcloud.io/api/issues/search')"

          printf '%s\n' "$response" > build/sonar-diagnostics/pr-issues.json
          new_issues="$(jq -r '.paging.total // .total' <<<"$response")"
          echo "Sonar PR #${SONAR_PULL_REQUEST} open/confirmed issues on New Code: ${new_issues}"
          jq -r '.issues[] | "SONAR_ISSUE\t\(.key)\t\(.rule)\t\(.severity)\t\(.type)\t\(.component)\t\(.line // 0)\t\(.message)"' <<<"$response"

          jq -r '.issues[] | [.rule, .severity, .type, .component, (.line // 1 | tostring), .message] | @tsv' <<<"$response" |
            while IFS=$'\t' read -r rule severity type component line message; do
              file="${component#*:}"
              message="${message//'%'/'%25'}"
              message="${message//$'\r'/'%0D'}"
              message="${message//$'\n'/'%0A'}"
              echo "::notice file=${file},line=${line},title=Sonar ${rule} [${severity}/${type}]::${message}"
            done

      - name: Upload Sonar test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/sonar-diagnostics/**
            build/test-results/test/**
            build/test-results/testJunit/**
            build/reports/tests/test/**
            build/reports/tests/testJunit/**
            build/reports/jacoco/test/**
            build/reports/jacoco/provider-free/**
            build/reports/jacoco/battle-mage-provider/**
            build/reports/jacoco/ars-provider/**
            build/reports/jacoco/create-provider/**
            build/reports/jacoco/minecolonies-provider/**
            runs/gameTestServer/logs/**

      - name: Verify Sonar new-code issue count on main
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "componentKeys=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main' \
            --data-urlencode 'sinceLeakPeriod=true' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=1' \
            'https://sonarcloud.io/api/issues/search')"

          new_issues="$(jq -r '.paging.total // .total' <<<"$response")"
          echo "Sonar open/confirmed issues on New Code: ${new_issues}"

          if [ "$new_issues" -ne 0 ]; then
            echo "Sonar New Code guard failed: ${new_issues} open/confirmed issue(s)." >&2
            exit 1
          fi
