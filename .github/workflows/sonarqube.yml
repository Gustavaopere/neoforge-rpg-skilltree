name: SonarQube Cloud

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --no-daemon build sonar --info

      - name: Diagnostic - print JaCoCo coverage for A0031-A0040 changed classes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = 'build/reports/jacoco/test/jacocoTestReport.xml'
          targets = {
              'dev/gustavopere/rpgskilltree/core/A0021A0040CombatPolicy',
              'dev/gustavopere/rpgskilltree/core/A0021A0040CombatState',
              'dev/gustavopere/rpgskilltree/core/A0021A0040MasteryPolicy',
              'dev/gustavopere/rpgskilltree/runtime/compat/epicfight/A0021A0040EpicFightHooks',
              'dev/gustavopere/rpgskilltree/runtime/compat/epicfight/A0021A0040MasteryHooks',
          }
          root = ET.parse(report).getroot()
          found = set()
          for package in root.findall('package'):
              for clazz in package.findall('class'):
                  name = clazz.attrib['name']
                  if name not in targets:
                      continue
                  found.add(name)
                  counters = {c.attrib['type']: (int(c.attrib['missed']), int(c.attrib['covered'])) for c in clazz.findall('counter')}
                  parts = []
                  for metric in ('LINE', 'BRANCH', 'INSTRUCTION'):
                      missed, covered = counters.get(metric, (0, 0))
                      total = missed + covered
                      pct = 100.0 if total == 0 else 100.0 * covered / total
                      parts.append(f'{metric.lower()}={covered}/{total}({pct:.1f}%)')
                  print('JACOCO_CLASS', name, *parts)
          missing = targets - found
          for name in sorted(missing):
              print('JACOCO_CLASS_MISSING', name)
          PY
