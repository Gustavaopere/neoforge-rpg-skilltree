name: SonarQube Cloud

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Sonar workflow policy test
        run: python3 scripts/test_sonar_workflow_policy.py

      - name: Sonar New Code period self-healing regression test
        run: python3 scripts/test_sonar_new_code_period_policy.py

      - name: Diagnose Sonar main analysis history on internal PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "project=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main' \
            --data-urlencode 'ps=100' \
            'https://sonarcloud.io/api/project_analyses/search')"

          echo "Sonar main analysis history:"
          jq -r '.analyses[]? | [.key // "?", .date // "?", .revision // "?", .projectVersion // "?", ([.events[]? | ((.category // "?") + ":" + (.name // "?"))] | join(","))] | @tsv' <<<"$response" |
            while IFS=$'\t' read -r analysis date revision project_version events; do
              printf '  analysis=%s date=%s revision=%s projectVersion=%s events=%s\n' \
                "$analysis" "$date" "$revision" "$project_version" "$events"
            done

      - name: Ensure Sonar New Code period is Previous version
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/ensure_sonar_new_code_period.py

      - name: Volcanoes NBT tag constant regression test
        run: python3 scripts/test_volcanoes_nbt_tag_constant_access.py

      - name: Sonar New Code hotspot regression test
        run: python3 scripts/test_sonar_new_code_hotspots.py

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --no-daemon -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 build sonar --info

      - name: Verify Sonar new-code issue count on main
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "componentKeys=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main' \
            --data-urlencode 'sinceLeakPeriod=true' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=1' \
            'https://sonarcloud.io/api/issues/search')"

          new_issues="$(jq -r '.paging.total // .total' <<<"$response")"
          echo "Sonar open/confirmed issues on New Code: ${new_issues}"

          if [ "$new_issues" -ne 0 ]; then
            echo "Sonar New Code guard failed: ${new_issues} open/confirmed issue(s)." >&2
            exit 1
          fi
