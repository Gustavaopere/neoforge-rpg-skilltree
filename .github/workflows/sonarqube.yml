name: SonarQube Cloud

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Sonar workflow policy test
        run: python3 scripts/test_sonar_workflow_policy.py

      - name: Sonar New Code hotspot regression test
        run: python3 scripts/test_sonar_new_code_hotspots.py

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --no-daemon -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 build sonar --info

      - name: Report Sonar PR issues after quality-gate failure
        if: failure() && github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
          SONAR_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "componentKeys=${SONAR_PROJECT}" \
            --data-urlencode "pullRequest=${SONAR_PR}" \
            --data-urlencode 'sinceLeakPeriod=true' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=100' \
            'https://sonarcloud.io/api/issues/search')"

          echo "Sonar open/confirmed PR issues on New Code: $(jq -r '.paging.total // .total' <<<"$response")"
          jq -r '.issues[] | [
            (.severity // "?"),
            (.type // "?"),
            (.rule // "?"),
            (.component // "?"),
            ((.line // 0) | tostring),
            (.message // "?")
          ] | @tsv' <<<"$response"

      - name: Verify Sonar new-code issue count on main
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "componentKeys=${SONAR_PROJECT}" \
            --data-urlencode 'branch=main' \
            --data-urlencode 'sinceLeakPeriod=true' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=1' \
            'https://sonarcloud.io/api/issues/search')"

          new_issues="$(jq -r '.paging.total // .total' <<<"$response")"
          echo "Sonar open/confirmed issues on New Code: ${new_issues}"

          if [ "$new_issues" -ne 0 ]; then
            echo "Sonar New Code guard failed: ${new_issues} open/confirmed issue(s)." >&2
            exit 1
          fi
