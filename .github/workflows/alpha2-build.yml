name: Alpha 2 Build

on:
  push:
    branches:
      - main
      - feat/alpha2-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Materialize verified Alpha 2 snapshot when staged
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .alpha2-package/part-00.b64 ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          cat \
            .alpha2-package/part-00.b64 \
            .alpha2-package/part-01.b64 \
            .alpha2-package/part-02.b64 \
            .alpha2-package/part-03.b64 \
            .alpha2-package/part-04.b64 \
            .alpha2-package/part-05.b64 \
            .alpha2-package/part-06.b64 \
            .alpha2-package/part-07.b64 \
            .alpha2-package/part-08.b64 \
            .alpha2-package/part-09.b64 \
            .alpha2-package/part-10a.b64 \
            .alpha2-package/part-10b.b64 \
            .alpha2-package/part-11a.b64 \
            .alpha2-package/part-11b.b64 \
            .alpha2-package/part-12a.b64 \
            .alpha2-package/part-12b.b64 \
            .alpha2-package/part-13.b64 \
            | tr -d '\r\n' > /tmp/alpha2-source.b64
          base64 --decode /tmp/alpha2-source.b64 > /tmp/alpha2-source.tar.xz
          test "$(stat -c%s /tmp/alpha2-source.tar.xz)" -eq 83120
          echo "c9bba2b5e229a91dbb378301f296f973c2496e791ac629abe50be03e9db56f94  /tmp/alpha2-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/alpha2-source.tar.xz -C .

      - name: Regenerate derived skill-tree data
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-tree-skeleton.py
          python3 scripts/export-passive-tree.py
          python3 scripts/export-client-tree.py
          python3 scripts/export-client-classes.py
          python3 scripts/export-client-choices.py
          python3 scripts/generate-node-effects.py
          python3 scripts/generate-warlock-subtree.py
          python3 scripts/generate-morph-subtrees.py

      - name: Core tests
        run: bash scripts/test-core.sh

      - name: Data validation
        run: python3 scripts/validate-data.py

      - name: Client tree validation
        run: python3 scripts/validate-client-tree.py

      - name: Node effect validation
        run: python3 scripts/validate-node-effects.py

      - name: Passive export validation
        run: python3 scripts/validate-passive-export.py

      - name: Runtime scaffold validation
        run: python3 scripts/verify-runtime-scaffold.py

      - name: Diff sanity
        run: git diff --check

      - name: NeoForge build
        run: gradle --no-daemon build

      - name: Commit materialized source after successful build
        if: steps.snapshot.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .alpha2-package .alpha2-sync .alpha2-sync-xz
          rm -f .github/workflows/alpha2-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f generated src/main/resources/data/rpgskilltree/skills src/main/resources/data/rpgskilltree/skill_trees || true
          git add -A
          git commit -m "feat: materialize Alpha 2 runtime snapshot"
          git push origin HEAD:feat/alpha2-runtime

# retrigger after verified snapshot halves were corrected
