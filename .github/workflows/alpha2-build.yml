name: RPG Skill Tree CI

on:
  push:
    branches:
      - main
      - feat/alpha2-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending build status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'rpgskilltree/full-build',
              description: 'NeoForge build and runtime verification are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Regenerate derived skill-tree data
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-tree-skeleton.py
          python3 scripts/export-passive-tree.py
          python3 scripts/export-client-tree.py
          python3 scripts/export-client-classes.py
          python3 scripts/export-client-choices.py
          python3 scripts/generate-node-effects.py
          python3 scripts/generate-warlock-subtree.py
          python3 scripts/generate-morph-subtrees.py

      - name: Core tests
        run: bash scripts/test-core.sh

      - name: Epic Fight exact stamina receipt JAR contract
        shell: bash
        run: |
          set +e
          gradle --no-daemon verifyEpicFightReceiptJarContract
          STATUS=$?
          set -e
          EXACT_JAR="$(find "$HOME/.gradle" -type f -name 'vu3NZ5Ma-8HHhJt6i.jar' -print -quit)"
          if [ -n "$EXACT_JAR" ]; then
            echo "EPICFIGHT_RECEIPT_RESOLVED_JAR=$EXACT_JAR"
            sha256sum "$EXACT_JAR"
            echo '--- packaged Epic Fight mod metadata ---'
            unzip -p "$EXACT_JAR" META-INF/neoforge.mods.toml | grep -E '^[[:space:]]*(modId|version)[[:space:]]*=' || true
            echo '--- end packaged Epic Fight mod metadata ---'
          else
            echo 'Exact Epic Fight artifact was not found in the Gradle cache.'
          fi
          exit "$STATUS"

      - name: Data validation
        run: python3 scripts/validate-data.py

      - name: Client tree validation
        run: python3 scripts/validate-client-tree.py

      - name: Node effect validation
        run: python3 scripts/validate-node-effects.py

      - name: Passive export validation
        run: python3 scripts/validate-passive-export.py

      - name: Runtime scaffold validation
        run: python3 scripts/verify-runtime-contract.py

      - name: Diff sanity
        run: git diff --check

      - name: NeoForge build
        run: gradle --no-daemon build

      - name: Verify built JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'RPGSkillTree*.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fx 'META-INF/neoforge.mods.toml'
          jar tf "$JAR" | grep -Fx 'rpgskilltree-compat-epicfight-receipt.mixins.json'
          jar tf "$JAR" | grep -Fx 'dev/gustavopere/rpgskilltree/RpgSkillTreeMod.class'
          jar tf "$JAR" | grep -Fx 'dev/gustavopere/rpgskilltree/runtime/compat/epicfight/EpicFightExactStaminaReceiptBridge.class'
          jar tf "$JAR" | grep -Fx 'dev/gustavopere/rpgskilltree/runtime/compat/epicfight/EpicFightExecutionScope.class'
          jar tf "$JAR" | grep -Fx 'dev/gustavopere/rpgskilltree/runtime/mixin/epicfight/PlayerPatchStaminaReceiptMixin.class'
          jar tf "$JAR" | grep -Fx 'dev/gustavopere/rpgskilltree/runtime/mixin/epicfight/SkillContainerStaminaReceiptMixin.class'
          jar tf "$JAR" | grep -Fx 'dev/gustavopere/rpgskilltree/runtime/mixin/epicfight/ComboAttacksStaminaReceiptMixin.class'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'config="rpgskilltree-compat-epicfight-receipt.mixins.json"'
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"

      - name: NeoForge dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/server build
          printf 'eula=true\n' > runs/server/eula.txt
          LOG="$PWD/build/server-smoke.log"
          gradle --no-daemon runServer >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG"; then
              echo 'Dedicated-server smoke test: PASS'
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'Dedicated server exited before reaching ready state.'
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done

          echo 'Dedicated server did not reach ready state within the smoke-test window.'
          cat "$LOG"
          exit 1

      - name: Upload built JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RPGSkillTree-${{ github.sha }}
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload server smoke log on failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-${{ github.sha }}
          path: build/server-smoke.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish final build status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const passed = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'rpgskilltree/full-build',
              description: passed
                ? 'Build, JAR structure, and server startup verified'
                : 'Full verification failed; inspect linked Actions run',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
