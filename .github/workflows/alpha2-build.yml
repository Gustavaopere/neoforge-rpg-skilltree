name: RPG Skill Tree CI

on:
  push:
    branches:
      - main
      - feat/alpha2-runtime
  pull_request:
    branches:
      - main
      - feat/chat2-a0041-a0050-stacked-handoff

concurrency:
  group: rpgskilltree-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  statuses: write

jobs:
  reconcile-chat2-status:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/chat2-a0051-a0060-stacked-handoff'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: feat/chat2-a0051-a0060-stacked-handoff
          fetch-depth: 1

      - name: Reconcile STATUS.md exactly and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('plans/03-skill-tree-perks/perks/STATUS.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "| A0051 | Precisão com Bestas | APROVADO após correção/review | IMPLEMENTAÇÃO PARCIAL no crítico CROSSBOW | `P-A0051-01`: exigir launch provenance; producer/ledger CROSSBOW de A0049 já existe |": "| A0051 | Precisão com Bestas | APROVADO após correção/review | CÓDIGO PRESENTE / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | launch provenance CROSSBOW implementada; Chat 3 valida uma única resolução crítica/root e provider-present/absent |",
              "| A0052 | Cadência de Recarga | APROVADO após correção/review | IMPLEMENTAÇÃO PARCIAL / estruturalmente indisponível | `P-A0052-01/-02/-04`: availability, mesma besta e Multishot; `P-A0052-05/-06`: launch provenance + lifecycle; herda A0050 |": "| A0052 | Cadência de Recarga | APROVADO após correção/review | CÓDIGO PRESENTE EM FAIL-CLOSED / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | herda `UNAVAILABLE_NODE` de A0050; mesma besta + launch provenance + lifecycle implementados; `P-A0052-04` Multishot `success-wins` permanece pendência técnica |",
              "| A0053 | Virote Perfurante | APROVADO após correção/review | IMPLEMENTAÇÃO PARCIAL / nó indisponível | `P-A0053-01/-02`: availability + reservation→commit; `P-A0053-03/-04`: launch provenance + lifecycle; herda cadeia CROSSBOW |": "| A0053 | Virote Perfurante | APROVADO após correção/review | CÓDIGO PRESENTE EM FAIL-CLOSED / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | indisponível transitivamente; reservation→commit + launch provenance + lifecycle implementados; Chat 3 valida cancel/no-spawn/dedup |",
              "| A0054 | Maestria de Bestas — Mecanismo Ajustado | APROVADO após correção/review | IMPLEMENTAÇÃO PARCIAL / estruturalmente indisponível | `P-A0054-01/-04`: consumo/rollback; `P-A0054-02`: availability; `P-A0054-03` ledger CROSSBOW já possui chave canônica; `P-A0054-05/-06`: launch provenance + lifecycle |": "| A0054 | Maestria de Bestas — Mecanismo Ajustado | APROVADO após correção/review | CÓDIGO PRESENTE EM FAIL-CLOSED / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | Cadência/janela transacionais implementadas; cadeia permanece indisponível por A0050 e reload/preparation-speed semântico segue ausente |",
              "| A0055 | Treino com Armas de Punho I | APROVADO após correção | NÃO CONFIRMADO como adquirível | `P-A0055-01`: producer único `combat:fist`; `P-A0055-02`: architecture `combat_fist`; `P-A0055-03`: regressão cruzada |": "| A0055 | Treino com Armas de Punho I | APROVADO após correção | CÓDIGO PRESENTE / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | `combat:fist` finite-discovery + architecture `combat_fist` já presentes; Chat 3 valida provider/architecture/dedup |",
              "| A0056 | Treino com Armas de Punho II | APROVADO | CÓDIGO PRESENTE via attack-speed | depende do fechamento de A0055 e reconciliação de rank/gateway |": "| A0056 | Treino com Armas de Punho II | APROVADO | CÓDIGO PRESENTE / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | attack-speed provider-native FIST/knuckle presente; Chat 3 valida provider-present/absent e dedicated server |",
              "| A0057 | Precisão com Armas de Punho | APROVADO após correção | CÓDIGO PRESENTE no crítico FIST | depende do fechamento de A0055 e reconciliação de rank/gateway |": "| A0057 | Precisão com Armas de Punho | APROVADO após correção | CÓDIGO PRESENTE / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | resolver crítico canônico FIST presente; Chat 3 valida uma rolagem/root e direct-player provenance |",
              "| A0058 | Sequência Limpa | APROVADO após correção/review | IMPLEMENTAÇÃO PARCIAL | `P-A0058-01`: heavy-impact; `P-A0058-02`: body modulation opcional; `P-A0058-03`: lifecycle rank/respec/rules reload; depende de A0055 |": "| A0058 | Sequência Limpa | APROVADO após correção/review | CÓDIGO PRESENTE NO FALLBACK CANÔNICO / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | lifecycle rank/respec/rules reload resolvido; heavy-impact receipt segue ausente e body modulation permanece opcional/fail-closed |",
              "| A0059 | Quebra de Ritmo | APROVADO | FAIL-CLOSED CORRETO | `P-A0059-01`: heavy/finalizer; `P-A0059-02`: guard-break movement; `P-A0059-03`: lifecycle próprio; depende de A0055/A0058 |": "| A0059 | Quebra de Ritmo | APROVADO | CÓDIGO PRESENTE EM FAIL-CLOSED / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | heavy/finalizer e guard-break provider receipts permanecem ausentes; nenhuma heurística substituta foi criada |",
              "| A0060 | Maestria de Armas de Punho — Combinação Final | APROVADO após review de lifecycle | FAIL-CLOSED CORRETO | `P-A0060-01`: heavy/finalizer; `P-A0060-02`: Stamina ledger; `P-A0060-03`: gate80 `combat:fist`; `P-A0060-04`: lifecycle cooldown/reserva |": "| A0060 | Maestria de Armas de Punho — Combinação Final | APROVADO após review de lifecycle | CÓDIGO PRESENTE EM FAIL-CLOSED / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3 | gate80 `combat:fist` + lifecycle do cooldown resolvidos; heavy/finalizer e ledger causal de Stamina permanecem ausentes |",
              "- **Mastery FIST:** fonte canônica do ramo A0055–A0060 é `combat:fist`, +10 por tipo hostil inédito; 6 tipos→60 e 8→80. O producer genérico `epicfight:fist` deve ser reconciliado/suprimido; `tree_architecture/combat.json` precisa publicar `combat_fist` antes de o gate ser considerado alinhado.": "- **Mastery FIST:** fonte canônica do ramo A0055–A0060 é `combat:fist`, +10 por tipo hostil inédito; 6 tipos→60 e 8→80. `FistMasteryMilestonePolicy` + `WeaponMasteryMilestoneRuntime` implementam discovery finita e deduplicada, e `tree_architecture/combat.json` publica `combat_fist`; nenhuma ledger paralela `epicfight:fist` é válida para essa disciplina."
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          anchor = "O fechamento operacional deste lote exige PR, review, CI GREEN, merge e confirmação da `main`; após isso o ciclo encerra e A0061+ só pode começar mediante novo comando do usuário.\n\n## Chat 1 — lote exato A0061–A0070"
          subsection = """O fechamento operacional deste lote exige PR, review, CI GREEN, merge e confirmação da `main`; após isso o ciclo encerra e A0061+ só pode começar mediante novo comando do usuário.

### A0051–A0060 — Chat 2

- **Branch:** `feat/chat2-a0051-a0060-stacked-handoff`.
- **PR operacional:** #387, empilhada sobre `feat/chat2-a0041-a0050-stacked-handoff` / PR #364.
- **PR histórica/TDD:** #386, fechada sem merge após o endpoint de retarget retornar 502 repetidamente.
- **Auditoria:** `audits/AUDITORIA-CHAT2-A0051-A0060-IMPLEMENTACAO.md`.
- A PR Chat 1 #249 já estava histórica/encerrada quando o Chat 2 iniciou; por isso o handoff operacional usa a sucessora empilhada #387.
- CROSSBOW: launch provenance de A0051 endurecida; A0052 herda indisponibilidade de A0050 e recebeu correlação da mesma besta/lifecycle; A0053/A0054 usam reservation→commit ligado à criação confirmada do projectile/root.
- FIST: `combat:fist`/`combat_fist` já estão materializados; A0055–A0057 usam a infraestrutura canônica; A0058 recebeu lifecycle de Sequência; A0059/A0060 continuam fail-closed sem receipts provider-native seguros.
- **Pendência técnica não-redesign:** `P-A0052-04`, outcome agregado Multishot `success-wins`, deve ser fechado antes de futura habilitação de A0052.
- **Pendências provider-dependent fail-closed:** reload/preparation-speed CROSSBOW; heavy-impact recebido; heavy/finalizer; guard-break causal; ledger causal de Stamina.
- **Evidência de desenvolvimento:** HEAD `7abd8fe64eff623f8e0f375b5dd60dc4007b981b`, RPG Skill Tree CI #3266 / run `33587291688` SUCCESS, com Core, 900 JUnit, NeoForge GameTests, validações, build/JAR e dedicated-server smoke verdes.
- **Estado:** **CÓDIGO PRESENTE / CHAT 2 CONCLUÍDO / AGUARDANDO VALIDAÇÃO CHAT 3**. Esta evidência não promove `IMPLEMENTAÇÃO CONFIRMADA`.
- O Chat 2 **não faz merge** e **não inicia A0061**.

## Chat 1 — lote exato A0061–A0070"""
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one insertion anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, subsection, 1), encoding='utf-8')
          PY

          git fetch origin feat/chat2-a0041-a0050-stacked-handoff --depth=1
          git show FETCH_HEAD:.github/workflows/alpha2-build.yml > .github/workflows/alpha2-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plans/03-skill-tree-perks/perks/STATUS.md .github/workflows/alpha2-build.yml
          git diff --cached --check
          git commit -m "docs(perks): close Chat 2 status A0051-A0060"
          git push origin HEAD:feat/chat2-a0051-a0060-stacked-handoff

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending build status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'rpgskilltree/full-build',
              description: 'NeoForge build and runtime verification are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper contract
        run: python3 scripts/verify-gradle-wrapper.py

      - name: Regenerate derived skill-tree data
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-tree-skeleton.py
          python3 scripts/export-passive-tree.py
          python3 scripts/export-client-tree.py
          python3 scripts/export-client-classes.py
          python3 scripts/export-client-choices.py
          python3 scripts/generate-node-effects.py
          python3 scripts/generate-warlock-subtree.py
          python3 scripts/generate-morph-subtrees.py

      - name: Core tests
        run: bash scripts/test-core.sh

      - name: Wiki catalog generator tests
        run: python3 scripts/test_wiki_catalog.py

      - name: Wiki catalog drift check
        run: python3 scripts/generate-wiki-catalog.py --check

      - name: Main-tree content coverage audit
        run: python3 scripts/audit-wiki-coverage.py --tree rpgskilltree:main

      - name: JUnit 5 tests
        run: ./gradlew --no-daemon test

      - name: NeoForge GameTests
        run: ./gradlew --no-daemon runGameTestServer

      - name: Compendium provenance tests
        run: python3 scripts/compendium/test_provenance.py

      - name: Compendium inventory catalog tests
        run: bash scripts/compendium/test_inventory_catalog.sh

      - name: Compendium model and provider tests
        run: bash scripts/compendium/test_model_catalog.sh

      - name: Compendium modlist parser tests
        run: python3 scripts/compendium/test_inventory_modlist.py

      - name: Compendium runtime coverage report tests
        run: python3 scripts/compendium/test_inventory_runtime_report.py

      - name: Compendium editorial backlog tests
        run: python3 scripts/compendium/test_editorial_backlog.py

      - name: Compendium editorial corpus tests
        run: python3 scripts/compendium/test_editorial_corpus.py

      - name: Data validation
        run: python3 scripts/validate-data.py

      - name: Client tree validation
        run: python3 scripts/validate-client-tree.py

      - name: Node effect validation
        run: python3 scripts/validate-node-effects.py

      - name: Passive export validation
        run: python3 scripts/validate-passive-export.py

      - name: Runtime scaffold validation
        run: python3 scripts/verify-runtime-contract.py

      - name: Attribute runtime validation
        run: python3 scripts/verify-attribute-runtime.py

      - name: Unified node effect runtime validation
        run: python3 scripts/verify-node-effect-runtime.py

      - name: Canonical provider binding runtime validation
        run: python3 scripts/verify-canonical-binding-runtime.py

      - name: Foundation diagnostics validation
        run: python3 scripts/verify-foundation-diagnostics.py

      - name: Generated data drift and diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code

      - name: NeoForge build
        run: ./gradlew --no-daemon build

      - name: Verify built JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'RPGSkillTree*.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fx 'META-INF/neoforge.mods.toml'
          jar tf "$JAR" | grep -Fx 'dev/gustavopere/rpgskilltree/RpgSkillTreeMod.class'
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"

      - name: NeoForge dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/server build
          printf 'eula=true\n' > runs/server/eula.txt
          LOG="$PWD/build/server-smoke.log"
          REPORT="$PWD/runs/server/generated/compendium/runtime-registry-inventory.json"
          COVERAGE_JSON="$PWD/build/compendium-smoke-coverage.json"
          COVERAGE_MD="$PWD/build/compendium-smoke-coverage.md"
          rm -f "$REPORT" "$COVERAGE_JSON" "$COVERAGE_MD"
          export RPGSKILLTREE_COMPENDIUM_INVENTORY=1
          ./gradlew --no-daemon runServer >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG" \
              && grep -Fq 'Compendium entity catalog published with ' "$LOG" \
              && grep -Fq 'Compendium editorial catalog published with ' "$LOG" \
              && test -f "$REPORT"; then
              python3 scripts/verify-optional-provider-smoke.py "$LOG"
              python3 - "$REPORT" <<'PY'
          import json
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema"] == 1
          assert payload["entry_count"] == len(payload["entries"])
          assert any(mod["mod_id"] == "rpgskilltree" for mod in payload["loaded_mods"])
          assert any(entry["namespace"] == "minecraft" for entry in payload["entries"])
          kinds = {entry["kind"] for entry in payload["entries"]}
          for required in {"ENTITY", "FLORA", "TREE", "CROP", "BIOME", "STRUCTURE", "DIMENSION"}:
              assert required in kinds, (required, sorted(kinds))
          assert len(payload["runtime_fingerprint_sha256"]) == 64
          PY
              python3 scripts/compendium/inventory_runtime_report.py \
                "$REPORT" \
                --json "$COVERAGE_JSON" \
                --markdown "$COVERAGE_MD"
              test -s "$COVERAGE_JSON"
              test -s "$COVERAGE_MD"
              echo 'Dedicated-server smoke test: PASS'
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'Dedicated server exited before completing Compendium startup handlers.'
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done

          echo 'Dedicated server did not complete Compendium startup handlers within the smoke-test window.'
          cat "$LOG"
          exit 1

      - name: Upload built JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RPGSkillTree-${{ github.sha }}
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload server smoke log on failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-${{ github.sha }}
          path: build/server-smoke.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish final build status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const passed = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'rpgskilltree/full-build',
              description: passed
                ? 'Build, JAR structure, and server startup verified'
                : 'Full verification failed; inspect linked Actions run',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
