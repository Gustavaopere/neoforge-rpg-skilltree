name: Narrative Factory Consumer

on:
  pull_request:
    paths:
      - 'historia/**'
      - '.github/workflows/narrative-factory-consumer.yml'
  push:
    branches: [main]
    paths:
      - 'historia/**'
      - '.github/workflows/narrative-factory-consumer.yml'

permissions:
  contents: read

jobs:
  validate-narrative-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACTORY_SHA: 55a9ad69a8316b1fa531b4c12aa88b4b70b22874
      PROFILE: historia/narrative-authoring-profile.json
      STORY_ROOT: historia
      DIALOGUE_ROOT: historia/12-dialogos
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout RPG content
        uses: actions/checkout@v7

      - name: Checkout pinned Factory narrative toolkit
        uses: actions/checkout@v7
        with:
          repository: Gustavaopere/minecraft-mod-factory
          ref: ${{ env.FACTORY_SHA }}
          path: .factory
          persist-credentials: false

      - name: Validate story graph and editorial states
        run: >-
          python3 .factory/narrative/tooling/validate_story.py
          --profile "$PROFILE"
          --root "$STORY_ROOT"

      - name: Validate advanced narrative contracts
        run: >-
          python3 .factory/narrative/tooling/validate_advanced.py
          --profile "$PROFILE"
          --root "$STORY_ROOT"

      - name: Validate dialogue structure
        run: >-
          python3 .factory/narrative/tooling/validate_dialogues.py
          --profile "$PROFILE"
          --root "$DIALOGUE_ROOT"

      - name: Build spoiler-bearing narrative inventory locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .factory-ci/output
          python3 .factory/narrative/tooling/story_inventory.py \
            --profile "$PROFILE" \
            --root "$STORY_ROOT" \
            --format json \
            > .factory-ci/output/inventory.json

      - name: Validate neutral authority round-trip
        shell: bash
        run: |
          set -euo pipefail
          python3 .factory/narrative/tooling/authority_reconcile.py export-inventory \
            --inventory .factory-ci/output/inventory.json \
            --source github:neoforge-rpg-skilltree \
            --revision "$GITHUB_SHA" \
            --captured-at 2026-09-16T00:00:00Z \
            > .factory-ci/output/github-authority.json
          python3 .factory/narrative/tooling/authority_reconcile.py compare \
            --local .factory-ci/output/github-authority.json \
            --external .factory-ci/output/github-authority.json \
            --required-external \
            --field title \
            --field state
