name: Stage 06.01 Adapter Wiring

on:
  pull_request:
    branches:
      - main

concurrency:
  group: stage-06-01-adapter-wiring-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run production adapter wiring regression
        run: ./gradlew --no-daemon test --tests 'dev.gustavopere.rpgskilltree.runtime.compat.OptionalIntegrationAdapterRegistryJUnitTest'
