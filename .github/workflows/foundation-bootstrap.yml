name: Foundation Bootstrap Contract

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: foundation-bootstrap-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify environment, metadata and dependency contract
        run: python3 scripts/verify-foundation-bootstrap.py
