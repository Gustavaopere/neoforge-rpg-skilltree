name: Volcanoes Canonical Import

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.ref == 'feat/consolidate-volcanoes' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: feat/consolidate-volcanoes
          fetch-depth: 0

      - name: Fetch exact canonical Volcanoes source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='eaddc3232dfc600780769f4a5e7e45ff1e50181c'
          rm -rf /tmp/volcanoes
          git init /tmp/volcanoes
          git -C /tmp/volcanoes remote add origin https://github.com/Gustavaopere/Volcanoes.git
          git -C /tmp/volcanoes fetch --depth=1 origin "$SOURCE_SHA"
          git -C /tmp/volcanoes checkout --detach FETCH_HEAD
          test "$(git -C /tmp/volcanoes rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Import runtime, tests, resources and canonical project evidence
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/volcanoes

          test ! -e src/main/java/dev/gustavopere/volcanoes
          test ! -e src/test/java/dev/gustavopere/volcanoes

          mkdir -p src/main/java/dev/gustavopere src/test/java/dev/gustavopere
          cp -a "$SRC/src/main/java/dev/gustavopere/volcanoes" src/main/java/dev/gustavopere/
          cp -a "$SRC/src/test/java/dev/gustavopere/volcanoes" src/test/java/dev/gustavopere/

          mkdir -p src/main/resources/assets src/main/resources/data
          cp -a "$SRC/src/main/resources/assets/volcanoes" src/main/resources/assets/
          cp -a "$SRC/src/main/resources/data/volcanoes" src/main/resources/data/
          cp "$SRC/src/main/resources/volcanoes.mixins.json" src/main/resources/volcanoes.mixins.json

          mkdir -p docs/volcanoes plans/volcanoes integration-templates/volcanoes scripts/volcanoes .github/scripts/volcanoes licenses
          cp -a "$SRC/docs/." docs/volcanoes/
          cp -a "$SRC/plans/." plans/volcanoes/
          cp -a "$SRC/integration-templates/." integration-templates/volcanoes/
          cp -a "$SRC/scripts/." scripts/volcanoes/
          cp -a "$SRC/.github/scripts/." .github/scripts/volcanoes/

          mkdir -p docs/volcanoes/repository-source docs/volcanoes/workflows-source
          cp "$SRC/README.md" docs/volcanoes/repository-source/README.md
          cp "$SRC/SOURCES.md" docs/volcanoes/repository-source/SOURCES.md
          cp "$SRC/THIRD_PARTY_NOTICES.md" docs/volcanoes/repository-source/THIRD_PARTY_NOTICES.md
          cp "$SRC/build.gradle" docs/volcanoes/repository-source/build.gradle.txt
          cp "$SRC/gradle.properties" docs/volcanoes/repository-source/gradle.properties.txt
          cp "$SRC/src/main/resources/META-INF/neoforge.mods.toml" docs/volcanoes/repository-source/neoforge.mods.toml.txt
          cp -a "$SRC/.github/workflows/." docs/volcanoes/workflows-source/
          cp "$SRC/LICENSE" licenses/Volcanoes-BSD-2-Clause.txt

          cat > docs/volcanoes/IMPORT_PROVENANCE.md <<'EOF'
          # Volcanoes import provenance

          This subtree was mechanically imported from `Gustavaopere/Volcanoes` at exact canonical commit
          `eaddc3232dfc600780769f4a5e7e45ff1e50181c` during consolidation into the single
          `rpgskilltree` NeoForge mod/JAR.

          Runtime source, tests and `volcanoes` resource namespaces are active integration inputs.
          The repository-source/workflows-source material is retained as migration, legal and CI evidence;
          it is not a second mod distribution.
          EOF

      - name: Commit imported canonical snapshot and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/gustavopere/volcanoes \
                  src/test/java/dev/gustavopere/volcanoes \
                  src/main/resources/assets/volcanoes \
                  src/main/resources/data/volcanoes \
                  src/main/resources/volcanoes.mixins.json \
                  docs/volcanoes plans/volcanoes integration-templates/volcanoes \
                  scripts/volcanoes .github/scripts/volcanoes licenses/Volcanoes-BSD-2-Clause.txt
          git rm .github/workflows/_volcanoes-import.yml
          git diff --cached --quiet && { echo 'Import produced no changes'; exit 1; }
          git commit -m 'chore: import Volcanoes canonical source [volcanoes-import]'
          git push origin HEAD:feat/consolidate-volcanoes
