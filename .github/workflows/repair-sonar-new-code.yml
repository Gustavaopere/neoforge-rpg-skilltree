name: Repair Sonar Previous Version Baseline

on:
  push:
    branches:
      - chore/repair-sonar-previous-version-baseline

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Inspect and restore Previous version New Code definition
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: Gustavaopere_neoforge-rpg-skilltree
        shell: bash
        run: |
          set -euo pipefail
          auth=(--header "Authorization: Bearer ${SONAR_TOKEN}")
          base='https://sonarcloud.io/api'

          echo 'Current New Code settings:'
          before="$(curl --silent --show-error --fail --get "${auth[@]}" \
            --data-urlencode "component=${SONAR_PROJECT}" \
            --data-urlencode 'keys=sonar.leak.period,sonar.leak.period.type' \
            "${base}/settings/values")"
          jq '{settings: [.settings[] | {key, value, inherited}]}' <<<"$before"

          curl --silent --show-error --fail --request POST "${auth[@]}" \
            --data-urlencode "component=${SONAR_PROJECT}" \
            --data-urlencode 'key=sonar.leak.period' \
            --data-urlencode 'value=previous_version' \
            "${base}/settings/set" >/dev/null

          curl --silent --show-error --fail --request POST "${auth[@]}" \
            --data-urlencode "component=${SONAR_PROJECT}" \
            --data-urlencode 'key=sonar.leak.period.type' \
            --data-urlencode 'value=previous_version' \
            "${base}/settings/set" >/dev/null

          after="$(curl --silent --show-error --fail --get "${auth[@]}" \
            --data-urlencode "component=${SONAR_PROJECT}" \
            --data-urlencode 'keys=sonar.leak.period,sonar.leak.period.type' \
            "${base}/settings/values")"
          echo 'Restored New Code settings:'
          jq '{settings: [.settings[] | {key, value, inherited}]}' <<<"$after"

          period="$(jq -r '.settings[] | select(.key == "sonar.leak.period") | .value // empty' <<<"$after")"
          period_type="$(jq -r '.settings[] | select(.key == "sonar.leak.period.type") | .value // empty' <<<"$after")"
          test "$period" = 'previous_version'
          test "$period_type" = 'previous_version'
          echo 'Sonar New Code definition restored to Previous version and verified.'

      - name: Remove one-shot repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-sonar-new-code.yml
          git commit -m 'chore: remove one-shot Sonar baseline repair workflow'
          git push
