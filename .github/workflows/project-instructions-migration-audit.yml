name: Project instructions migration audit

on:
  push:
    branches:
      - docs/project-instructions-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate canonical instruction migration
        shell: bash
        run: |
          set -euo pipefail

          test ! -e plans/03-skill-tree-perks/guides
          test -d PROJECT-INSTRUCTIONS/guides
          test -f PROJECT-INSTRUCTIONS/modlist/MODLIST-DELTA-2026-09-07.md

          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'PROJECT-INSTRUCTIONS/CHAT-1-AUDITORIA-DESIGN-PERKS-ANEXOS-PROJETO.md': '999dfcc6d1fcc8911e4da282f7d40cc501f95a6a',
              'PROJECT-INSTRUCTIONS/CHAT-2-IMPLEMENTACAO-PERKS-ANEXOS-PROJETO.md': 'd7e22ca8049f19af72be7dc6ad86b3c59ed3b7c5',
              'PROJECT-INSTRUCTIONS/CHAT-3-PENDENCIAS-TESTES-VALIDACAO-MERGE-PERKS-ANEXOS-PROJETO.md': '1c2c59502e1ecdf1bb4582fbdba6c7c571bf984c',
              'PROJECT-INSTRUCTIONS/CRITERIOS-OBRIGATORIOS-PARA-APROVACAO-DE-PERKS.md': '6c8f8845d2872ebb7aeb064122ec13f95e06eb92',
              'PROJECT-INSTRUCTIONS/GUIA-COMPLETO-GAMEPLAY-E-SISTEMAS.md': '4be0ef7ad50a0eebfe0e06b7adbcef6012779593',
              'PROJECT-INSTRUCTIONS/GUIA-COMPLETO-MODS-DE-MAGIA.md': '105bf46bfdee80bf52b2b7e69876e59ce7a70f25',
              'PROJECT-INSTRUCTIONS/GUIA-COMPLETO-MODS-DE-TECNOLOGIA.md': '4944fd91c035917577bcd792c55deaac0aeca2bc',
              'PROJECT-INSTRUCTIONS/GUIA-COMPLETO-PROJETOS-PROPRIOS.md': '266c732054ffdef6d39b1ad80d5c3d394be87889',
          }
          for path, expected_sha in expected.items():
              if not Path(path).is_file():
                  raise SystemExit(f'missing canonical file: {path}')
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != expected_sha:
                  raise SystemExit(f'{path}: {actual} != {expected_sha}')
          print('8 canonical blobs unchanged')
          PY

          fail=0

          echo '=== active absolute legacy references ==='
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line"
            fail=1
          done < <(git grep -n -F 'plans/03-skill-tree-perks/guides' -- . \
            ':!PROJECT-INSTRUCTIONS/GUIA-COMPLETO-GAMEPLAY-E-SISTEMAS.md' \
            ':!PROJECT-INSTRUCTIONS/GUIA-COMPLETO-MODS-DE-MAGIA.md' \
            ':!PROJECT-INSTRUCTIONS/GUIA-COMPLETO-MODS-DE-TECNOLOGIA.md' \
            ':!PROJECT-INSTRUCTIONS/GUIA-COMPLETO-PROJETOS-PROPRIOS.md' \
            ':!PROJECT-INSTRUCTIONS/README.md' \
            ':!docs/superpowers/**' \
            ':!.github/workflows/project-instructions-migration-audit.yml' || true)

          echo '=== active relative legacy references ==='
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line"
            fail=1
          done < <(git grep -n -E '`?\.\./guides/(gameplay|magic|technology|projects)|(^|[^A-Za-z0-9_-])guides/projects/' -- . \
            ':!PROJECT-INSTRUCTIONS/guides/**' \
            ':!PROJECT-INSTRUCTIONS/GUIA-COMPLETO-GAMEPLAY-E-SISTEMAS.md' \
            ':!PROJECT-INSTRUCTIONS/GUIA-COMPLETO-MODS-DE-MAGIA.md' \
            ':!PROJECT-INSTRUCTIONS/GUIA-COMPLETO-MODS-DE-TECNOLOGIA.md' \
            ':!PROJECT-INSTRUCTIONS/GUIA-COMPLETO-PROJETOS-PROPRIOS.md' \
            ':!docs/superpowers/**' \
            ':!.github/workflows/project-instructions-migration-audit.yml' || true)

          if [ "$fail" -ne 0 ]; then
            echo 'Active legacy references remain.' >&2
            exit 1
          fi

          grep -F 'PROJECT-INSTRUCTIONS/' README.md >/dev/null
          grep -F '../../PROJECT-INSTRUCTIONS/README.md' plans/03-skill-tree-perks/README.md >/dev/null
          grep -F '../../../PROJECT-INSTRUCTIONS/guides/projects/' plans/03-skill-tree-perks/perks/README.md >/dev/null

          echo 'Project instruction migration validated.'