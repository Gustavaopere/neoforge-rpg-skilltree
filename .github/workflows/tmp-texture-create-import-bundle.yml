name: Temporary Texture Create Import Bundle Proof

on:
  push:
    branches:
      - feat/blockbench-texture-create-import-approved

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate standalone bundle
        run: node PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/build_toolkit_bundle.js --write
      - name: Verify deterministic bundle
        run: node PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/build_toolkit_bundle.js --check
      - name: Run texture create import contract
        run: node --test PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.texture_create_import.test.js
      - name: Run bundle load regression
        run: node --test PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.bundle_live_bridge.test.js
      - name: Run aggregate toolkit regression
        run: node --test PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.test.js
      - name: Commit regenerated standalone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.js
          if git diff --cached --quiet; then
            echo "Standalone already current"
          else
            git commit -m "build(blockbench): regenerate texture create import bundle"
            git push origin HEAD:feat/blockbench-texture-create-import-approved
          fi
