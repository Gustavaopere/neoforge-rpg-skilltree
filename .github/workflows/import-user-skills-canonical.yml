name: Import canonical user Minecraft skills bundle

on:
  push:
    branches:
      - chore/import-user-minecraft-skills-canonical
    paths:
      - '.github/workflows/import-user-skills-canonical.yml'

permissions:
  contents: write

jobs:
  import-skills:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: chore/import-user-minecraft-skills-canonical
          fetch-depth: 0

      - name: Reconstruct and verify exact canonical bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, gzip, hashlib, io, tarfile

          expected_names = ['minecraft-ci-release', 'minecraft-commands-scripting', 'minecraft-datapack', 'minecraft-dependency-compatibility-graph', 'minecraft-essentials-ops', 'minecraft-imagegen', 'minecraft-jar-reverse-engineering', 'minecraft-mod-dev', 'minecraft-modding', 'minecraft-modpack-bisect', 'minecraft-multiloader', 'minecraft-neoforge-engineering', 'minecraft-neoforge-modpack-debugging', 'minecraft-plugin-dev', 'minecraft-resource-pack', 'minecraft-server-admin', 'minecraft-testing', 'minecraft-world-generation', 'minecraft-worldedit-ops', 'modpack-inventory-redundancy-audit']
          parts=[Path(f'.skill-import/part-{i:03d}.b64') for i in range(13)] + [Path(f'.skill-import/part-013-{i:02d}.b64') for i in range(4)]
          missing=[str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit('missing staged parts: '+repr(missing))

          encoded=''.join(''.join(p.read_text(encoding='utf-8-sig').split()) for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          expected_digest='52e45940e4c4a4c0784a51020c869c35af149d68e86bb7930a6ba1feb8ae39aa'
          if digest != expected_digest:
              raise SystemExit(f'bundle SHA-256 mismatch: {digest} != {expected_digest}')

          data=gzip.decompress(raw)
          tf=tarfile.open(fileobj=io.BytesIO(data), mode='r:')
          members=tf.getmembers()
          bad=[]
          skill_dirs=set()
          source_files=0
          source_bytes=0
          for m in members:
              pp=PurePosixPath(m.name)
              if pp.is_absolute() or '..' in pp.parts:
                  bad.append(m.name)
                  continue
              if not (m.isfile() or m.isdir()):
                  bad.append(m.name + ' [unsupported member type]')
                  continue
              if not pp.parts or pp.parts[0] not in expected_names:
                  bad.append(m.name + ' [outside expected skill roots]')
                  continue
              if pp.name == 'SKILL.md':
                  skill_dirs.add(str(pp.parent))
              if m.isfile():
                  source_files += 1
                  source_bytes += m.size

          if bad:
              raise SystemExit('unsafe/unexpected archive members: '+repr(bad[:20]))
          actual_names=sorted(PurePosixPath(x).parts[0] for x in skill_dirs)
          if actual_names != sorted(expected_names):
              raise SystemExit(f'skill roots mismatch: {actual_names}')
          if source_files != 142:
              raise SystemExit(f'expected 142 source files in archive, got {source_files}')
          if source_bytes != 581125:
              raise SystemExit(f'expected 581125 source bytes in archive, got {source_bytes}')

          Path('/tmp/fullskills.tar.gz').write_bytes(raw)
          print('bundle sha256',digest,'members',len(members),'skills',len(actual_names),'files',source_files,'bytes',source_bytes)
          PY
          gzip -t /tmp/fullskills.tar.gz

      - name: Extract exact source payload while preserving project overlays
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fullskills
          mkdir -p /tmp/fullskills
          tar -xzf /tmp/fullskills.tar.gz -C /tmp/fullskills
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          expected_names = ['minecraft-ci-release', 'minecraft-commands-scripting', 'minecraft-datapack', 'minecraft-dependency-compatibility-graph', 'minecraft-essentials-ops', 'minecraft-imagegen', 'minecraft-jar-reverse-engineering', 'minecraft-mod-dev', 'minecraft-modding', 'minecraft-modpack-bisect', 'minecraft-multiloader', 'minecraft-neoforge-engineering', 'minecraft-neoforge-modpack-debugging', 'minecraft-plugin-dev', 'minecraft-resource-pack', 'minecraft-server-admin', 'minecraft-testing', 'minecraft-world-generation', 'minecraft-worldedit-ops', 'modpack-inventory-redundancy-audit']
          src_root=Path('/tmp/fullskills')
          dst_root=Path('PROJECT-INSTRUCTIONS/skills/library')
          dst_root.mkdir(parents=True,exist_ok=True)
          overlays=Path('/tmp/project-overlays')
          overlays.mkdir(parents=True,exist_ok=True)

          for name in expected_names:
              src=src_root/name
              if not (src/'SKILL.md').is_file():
                  raise SystemExit(f'{name}: missing source SKILL.md')
              target=dst_root/name
              overlay=target/'PROJECT-OVERLAY.md'
              if overlay.is_file():
                  shutil.copy2(overlay, overlays/f'{name}.md')
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(src,target)
              preserved=overlays/f'{name}.md'
              if preserved.is_file():
                  shutil.copy2(preserved,target/'PROJECT-OVERLAY.md')

          Path('/tmp/imported-skills.txt').write_text('\n'.join(expected_names)+'\n',encoding='utf-8')
          PY

      - name: Validate exact imported payload and overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected_names = ['minecraft-ci-release', 'minecraft-commands-scripting', 'minecraft-datapack', 'minecraft-dependency-compatibility-graph', 'minecraft-essentials-ops', 'minecraft-imagegen', 'minecraft-jar-reverse-engineering', 'minecraft-mod-dev', 'minecraft-modding', 'minecraft-modpack-bisect', 'minecraft-multiloader', 'minecraft-neoforge-engineering', 'minecraft-neoforge-modpack-debugging', 'minecraft-plugin-dev', 'minecraft-resource-pack', 'minecraft-server-admin', 'minecraft-testing', 'minecraft-world-generation', 'minecraft-worldedit-ops', 'modpack-inventory-redundancy-audit']
          root=Path('PROJECT-INSTRUCTIONS/skills/library')
          rows=[]
          total_files=0
          total_bytes=0
          missing_overlays=[]
          for name in expected_names:
              d=root/name
              source_files=[p for p in d.rglob('*') if p.is_file() and p.name!='PROJECT-OVERLAY.md']
              if not (d/'SKILL.md').is_file() or (d/'SKILL.md').stat().st_size == 0:
                  raise SystemExit(f'{name}: missing/empty SKILL.md')
              if not (d/'PROJECT-OVERLAY.md').is_file():
                  missing_overlays.append(name)
              count=len(source_files)
              size=sum(p.stat().st_size for p in source_files)
              total_files += count
              total_bytes += size
              rows.append((name,count,size))

          if missing_overlays:
              raise SystemExit('missing project overlays: '+repr(missing_overlays))
          if total_files != 142:
              raise SystemExit(f'expected 142 source files, got {total_files}')
          if total_bytes != 581125:
              raise SystemExit(f'expected 581125 source bytes, got {total_bytes}')

          report=[
              '# Full user skill bundle import',
              '',
              '- Imported skills: **20/20**',
              '- Source files validated: **142/142**',
              '- Source bytes validated: **581125**',
              '- Canonical bundle SHA-256: `52e45940e4c4a4c0784a51020c869c35af149d68e86bb7930a6ba1feb8ae39aa`',
              '- Project overlays preserved: **20/20**',
              '',
              '| Skill | Source files | Bytes |',
              '|---|---:|---:|',
          ]
          report += [f'| `{n}` | {fc} | {sz} |' for n,fc,sz in rows]
          report += [
              '',
              '> User-provided source payload is preserved exactly from the validated canonical bundle. Project-specific restrictions remain separate as `PROJECT-OVERLAY.md`.',
              ''
          ]
          Path('PROJECT-INSTRUCTIONS/skills/FULL-USER-SKILL-IMPORT.md').write_text('\n'.join(report),encoding='utf-8')
          PY

      - name: Remove temporary staging and importer
        shell: bash
        run: |
          rm -rf .skill-import
          rm -f .github/workflows/import-user-skills-canonical.yml

      - name: Commit canonical imported skill bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A PROJECT-INSTRUCTIONS/skills/library PROJECT-INSTRUCTIONS/skills/FULL-USER-SKILL-IMPORT.md .skill-import .github/workflows/import-user-skills-canonical.yml
          if git diff --cached --quiet; then
            echo 'No import changes to commit.'
            exit 0
          fi
          git commit -m 'chore(skills): import canonical full user-provided skill bundles'
          git push origin HEAD:chore/import-user-minecraft-skills-canonical
