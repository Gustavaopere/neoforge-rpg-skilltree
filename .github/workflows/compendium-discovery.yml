name: Compendium Discovery CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compendium discovery tests
        run: bash scripts/compendium/test_discovery.sh

      - name: Compendium discovery runtime validation
        run: python3 scripts/compendium/verify_discovery_runtime.py
