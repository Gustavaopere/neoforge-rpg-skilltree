name: Temporary UV Pack Bundle Commit

on:
  push:
    branches:
      - feat/blockbench-uv-pack-preview-apply

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate standalone bundle
        run: node PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/build_toolkit_bundle.js --write
      - name: Verify deterministic bundle
        run: node PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/build_toolkit_bundle.js --check
      - name: Run targeted UV pack regression
        run: node --test PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.uv_pack.test.js
      - name: Run bundle load regression
        run: node --test PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.bundle_live_bridge.test.js
      - name: Run aggregate toolkit regression
        run: node --test PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.test.js
      - name: Commit generated standalone and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          bundle='PROJECT-INSTRUCTIONS/skills/tools/blockbench/rpg-asset-toolkit/rpg_asset_toolkit.js'
          workflow='.github/workflows/tmp-uv-pack-bundle.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$bundle"
          git rm "$workflow"
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$workflow" "$bundle" | sort)"
          test "$actual" = "$expected"
          git commit -m 'build(blockbench): regenerate UV pack standalone'
          git push origin "HEAD:${GITHUB_REF_NAME}"
