name: Cold Sweat Heat Acceptance

on:
  push:
    branches:
      - 'feat/06-cold-sweat-heat'
      - 'feat/08-integrations'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-sweat-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-host-gametest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install exact Cold Sweat 2.4.2 runtime
        shell: bash
        run: |
          set -euo pipefail
          MODS="$PWD/runs/gameTestServer/mods"
          mkdir -p "$MODS"
          rm -f "$MODS"/cold-sweat-*.jar "$MODS"/cold_sweat-*.jar
          rm -rf runs/gameTestServer/world
          printf 'eula=true\n' > runs/gameTestServer/eula.txt

          curl --fail --location --retry 3 \
            'https://www.cursemaven.com/curse/maven/cold-sweat-506194/8302211/cold-sweat-506194-8302211.jar' \
            --output "$MODS/cold-sweat-2.4.2-neoforge-1.21.1.jar"

          jar tf "$MODS/cold-sweat-2.4.2-neoforge-1.21.1.jar" >/dev/null
          unzip -p "$MODS/cold-sweat-2.4.2-neoforge-1.21.1.jar" META-INF/neoforge.mods.toml \
            | grep -F 'version="2.4.2"'

      - name: Run exact-host volcanic heat GameTests
        run: gradle --no-daemon runGameTestServer
